          }, getInitials(user?.name));
        }

            style: {
              display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", background: `linear-gradient(90deg, ${TD}, ${TC})`,

          return e('label', { style: { display: "block", fontSize: 12, fontWeight: 600, color: TC, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6, marginTop: marginTop } }, text);

        function AuthScreen({ onDone, lang }) {

            if (activeSubTab === "fav" && !favIds.includes(u.id)) return false;
            if (!search.trim()) return true;
            const q = search.toLowerCase();
            return u.name.toLowerCase().includes(q) || u.location.toLowerCase().includes(q) || u.tags.some(tag => tag.toLowerCase().includes(q));

        function App() {
          const [lang, setLang] = useState(null);
          const [me, setMe] = useState(null);
          const [users, setUsers] = useState([]);
          const [activeTab, setActiveTab] = useState("feed");

          const [selectedUser, setSelectedUser] = useState(null);

            if (lang) {
              setUsers(getLocalizedUsers(lang));
              setMsgs({

              });
              if (me) setMe(prev => ({ ...prev, location: TRANSLATIONS_DATA[lang].ukraine }));

          const handleRegister = name => {
            const myAccount = { id: 999, name: name, location: "Киев, Украина", occupation: "Traveler", bio: "New user.", tags: [], isHost: false, likes: 0, subscribers: 1, rating: 5.0, reviews: [], housingInfo: null };
            setMe(myAccount); setCurrentScreen("mainFlow"); setActiveTab("feed");
          };

          const handleAddReview = (userId, reviewText) => {
            const newRev = { id: Date.now(), author: me.name, text: reviewText };
            setUsers(p => p.map(u => u.id === userId ? { ...u, reviews: [newRev, ...u.reviews] } : u));
            if (selectedUser?.id === userId) setSelectedUser(p => ({ ...p, reviews: [newRev, ...p.reviews] }));
          };

          if (currentScreen === "langSelect") return e(LangSelectScreen, { onSelect: c => { setLang(c); setCurrentScreen("auth"); } });
          if (currentScreen === "auth") return e(AuthScreen, { onDone: handleRegister, lang: lang });

          const renderMainContent = () => {
            if (currentScreen === "viewProfile" && selectedUser) return e(UserProfileView, { user: selectedUser, isSelf: selectedUser.id === me.id, onBack: () => setCurrentScreen("mainFlow"), onOpenChat: u => { setSelectedUser(u); setCurrentScreen("chatView"); }, onEdit: () => setCurrentScreen("editProfile"), lang: lang, onAddReview: handleAddReview });
            if (currentScreen === "editProfile") return e(EditProfileScreen, { user: me, onSave: f => { setMe(f); setCurrentScreen("mainFlow"); setActiveTab("profile"); }, onCancel: () => setCurrentScreen("mainFlow"), lang: lang });

              case "map": return e(MapScreen, { users: users, onSelectUser: u => { setSelectedUser(u); setCurrentScreen("viewProfile"); }, lang: lang });
              case "housing": return e(HousingScreen, { users: users, onSelectUser: u => { setSelectedUser(u); setCurrentScreen("viewProfile"); }, lang: lang });
              case "messages": return e(ChatsScreen, { users: users, msgs: msgs, onOpenChat: u => { setSelectedUser(u); setCurrentScreen("chatView"); }, lang: lang });
              case "profile": return e(UserProfileView, { user: me, isSelf: true, lang: lang, onEdit: () => setCurrentScreen("editProfile") });
              default: return null;
