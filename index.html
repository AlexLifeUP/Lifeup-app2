            e(HeaderBar, { 
              title: user?.name || "", 
              onBack: onBack, 
              lang: lang, 
              rightElement: isSelf && e('button', { 
                onClick: onEdit, 
                style: { color: "#fff", background: "rgba(0,191,179,0.2)", border: `1px solid ${TC}`, fontSize: 11, fontWeight: 700, padding: "6px 14px", borderRadius: 8, textTransform: "uppercase", boxShadow: `0 0 10px ${TC}40` } 
              }, "✎ Edit") 
            }),
            e('div', { style: { overflowY: "auto", flex: 1, padding: "16px", paddingBottom: 100 } },
              e('div', { style: { display: "flex", alignItems: "center", gap: 14, marginBottom: 16 } },
                e(Avatar, { user: user, size: 68 }),
                e('div', null, e('h2', { style: { margin: 0, fontSize: 18 } }, user?.name), e('div', { style: { fontSize: 12, color: TC, fontWeight: 600 } }, user?.location), e('div', { style: { fontSize: 11, color: "rgba(255,255,255,0.4)" } }, user?.occupation))
              ),
              !isSelf && e('button', { onClick: () => onOpenChat(user), style: { width: "100%", padding: "11px 0", background: TC, border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, marginBottom: 14 } }, t.btnMsg),
              e('p', { style: { background: "rgba(255,255,255,0.02)", border: `1px solid ${BR}`, padding: 12, borderRadius: 12, fontSize: 13, lineHeight: 1.5 } }, user?.bio),
              
              // Отображение соцсетей в профиле
              user?.socialLinks && Object.values(user.socialLinks).some(v=>v) && e('div', { style: { marginBottom: 16 } },
                e(FieldLabel, { text: t.socialTitle }),
                e('div', { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
                  Object.entries(user.socialLinks).filter(([,v])=>v).map(([net, val]) => (
                    e('span', { key: net, style: { fontSize: 12, background: "rgba(255,255,255,0.05)", padding: "4px 10px", borderRadius: 8, border: `1px solid ${BR}`, color: TC } }, `${net}: @${val}`)
                  ))
                )
              ),

              e(FieldLabel, { text: t.statusTitle }),
              e('div', { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 } },
                STATUS_OPTIONS.map(opt => {
                  const hasOpt = user && user[opt.key];
                  const labelKey = 'label' + lang.charAt(0).toUpperCase() + lang.slice(1);
                  return e('div', { key: opt.key, style: { display: "flex", alignItems: "center", gap: 6, background: hasOpt ? "rgba(0, 191, 179, 0.08)" : "rgba(255,255,255,0.02)", padding: "8px 10px", borderRadius: 10, border: `1px solid ${hasOpt ? 'rgba(0,191,179,0.3)' : 'transparent'}`, opacity: hasOpt ? 1 : 0.3 } },
                    e('span', null, opt.icon), e('span', { style: { fontSize: 10 } }, opt[labelKey] || opt.labelEn)
                  );
                })
              )
            )
          );
        }

        // ВОССТАНОВЛЕННЫЕ ВСЕ ПОЛЯ РЕДАКТИРОВАНИЯ И ПРИВЯЗКА СОЦСЕТЕЙ
        function EditProfileScreen({ user, onSave, onCancel, lang }) {
          const t = TRANSLATIONS_DATA[lang];
          const [form, setForm] = useState({ ...user, socialLinks: user.socialLinks || { instagram: "", twitter: "", telegram: "", facebook: "" } });

          return e('div', { style: W },
            e(HeaderBar, { title: t.editTitle, onBack: onCancel, lang: lang, rightElement: e('button', { onClick: () => onSave(form), style: { color: TC, background: "none", border: "none", fontWeight: 700, fontSize: 14, cursor: "pointer" } }, t.done) }),
            e('div', { style: { overflowY: "auto", flex: 1, padding: "16px", paddingBottom: 100 } },
              e(FieldLabel, { text: t.nameLbl }), e('input', { value: form.name, onChange: e => setForm({ ...form, name: e.target.value }), style: IS }),
              e(FieldLabel, { text: t.locLbl }), e('input', { value: form.location, onChange: e => setForm({ ...form, location: e.target.value }), style: IS }),
              e(FieldLabel, { text: t.occLbl }), e('input', { value: form.occupation, onChange: e => setForm({ ...form, occupation: e.target.value }), style: IS }),
              e(FieldLabel, { text: t.aboutLbl }), e('textarea', { value: form.bio, onChange: e => setForm({ ...form, bio: e.target.value }), style: { ...IS, height: 80, resize: "none" } }),
              
              e(FieldLabel, { text: t.socialTitle, marginTop: 10 }),
              e('input', { placeholder: "Instagram username", value: form.socialLinks.instagram, onChange: e => setForm({ ...form, socialLinks: { ...form.socialLinks, instagram: e.target.value } }), style: IS }),
              e('input', { placeholder: "Telegram username", value: form.socialLinks.telegram, onChange: e => setForm({ ...form, socialLinks: { ...form.socialLinks, telegram: e.target.value } }), style: IS }),
              e('input', { placeholder: "Twitter username", value: form.socialLinks.twitter, onChange: e => setForm({ ...form, socialLinks: { ...form.socialLinks, twitter: e.target.value } }), style: IS }),

              e(FieldLabel, { text: t.statusTitle, marginTop: 10 }),
              e('div', { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 } },
                STATUS_OPTIONS.map(opt => (
                  e('div', { key: opt.key, onClick: () => setForm({ ...form, [opt.key]: !form[opt.key] }), style: { display: "flex", alignItems: "center", gap: 6, background: form[opt.key] ? "rgba(0,191,179,0.12)" : "rgba(255,255,255,0.02)", padding: "10px 12px", borderRadius: 12, cursor: "pointer", border: `1px solid ${form[opt.key] ? TC : 'transparent'}` } },
                    e('span', null, opt.icon), e('span', { style: { fontSize: 10, flex: 1, color: form[opt.key] ? "#fff" : "rgba(255,255,255,0.4)" } }, lang === 'ua' ? opt.labelUa : opt.labelRu)
                  )
                ))
              )
            )
          );
        }

        // ОБНОВЛЕННОЕ НИЖНЕЕ МЕНЮ: ЦЕНТРАЛЬНЫЙ ДОМИК НА 1.5 РАЗА БОЛЬШЕ И ЯРЧЕ, УПАКОВАН В ПЛАШКИ
        function BottomNavigationBar({ activeTab, onTabChange }) {
          const navItems = [ 
            { id: "map", icon: "📍" }, 
            { id: "housing", icon: "🔑" }, 
            { id: "feed", icon: "🏠", isMain: true }, // Центральный домик
            { id: "messages", icon: "✉" }, 
            { id: "profile", icon: "👤" } 
          ];
          return e('div', { style: { position: "absolute", bottom: 12, left: 0, width: "100%", display: "flex", justifyContent: "space-around", padding: "0 12px", zIndex: 100 } },
            e('div', { style: { width: "100%", background: "rgba(10, 6, 22, 0.94)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 24, display: "flex", justifyContent: "space-around", padding: "8px 6px", alignItems: "center", boxShadow: "0 10px 30px rgba(0,0,0,0.7)", backdropFilter: "blur(20px)" } },
              navItems.map(item => {
                const isSel = activeTab === item.id;
                const size = item.isMain ? 56 : 42; // Домик в 1.5 раза больше
                return e('button', { 
                  key: item.id, 
                  onClick: () => onTabChange(item.id), 
                  style: { 
                    background: isSel ? `linear-gradient(135deg, ${TD}, ${TC})` : "rgba(255,255,255,0.04)", 
                    border: `1px solid ${isSel ? TC : 'rgba(255,255,255,0.06)'}`, 
                    fontSize: item.isMain ? 24 : 18, 
                    width: size, height: size, borderRadius: item.isMain ? 18 : 12,
                    color: isSel ? "#fff" : "rgba(255,255,255,0.5)", 
                    cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                    boxShadow: isSel ? `0 0 15px ${TC}70` : "none",
                    transform: isSel ? "scale(1.05)" : "scale(1)"
                  } 
                }, item.icon);
              })
            )
          );
        }

        function App() {
          const [lang, setLang] = useState(null);
          const [me, setMe] = useState(null);
          const [users, setUsers] = useState([]);
          const [activeTab, setActiveTab] = useState("feed");
          const [currentScreen, setCurrentScreen] = useState("langSelect");
          const [selectedUser, setSelectedUser] = useState(null);
          const [favIds, setFavIds] = useState([1]);
          const [msgs, setMsgs] = useState({});

          useEffect(() => {
            if (lang) {
              setUsers(getLocalizedUsers(lang));
              setMsgs({
                1: [ { id: 101, from: "them", text: "Привет! Ты сейчас в Киеве?", time: "11:00" }, { id: 102, from: "me", text: "Да, на Печерске, ищу попутчика на вечер!", time: "11:15" } ]
              });
              if (me) setMe(prev => ({ ...prev, location: "Киев, Украина" }));
            }
          }, [lang]);

          const handleRegister = name => {
            const myAcc = { id: 999, name, location: "Киев, Украина", occupation: "Founder", bio: "Мой первый крутой стартап!", tags: ["#startup"], isHost: false, likes: 5, subscribers: 10, rating: 5.0, reviews: [], housingInfo: null, socialLinks:{instagram:"",twitter:"",telegram:"",facebook:""} };
            setMe(myAcc); setCurrentScreen("mainFlow"); setActiveTab("feed");
          };

          if (currentScreen === "langSelect") return e(LangSelectScreen, { onSelect: c => { setLang(c); setCurrentScreen("auth"); } });
          if (currentScreen === "auth") return e(AuthScreen, { onDone: handleRegister, lang: lang, onBack: () => setCurrentScreen("langSelect") });

          const renderMainContent = () => {
            if (currentScreen === "viewProfile" && selectedUser) return e(UserProfileView, { user: selectedUser, isSelf: selectedUser.id === me.id, onBack: () => setCurrentScreen("mainFlow"), onOpenChat: u => { setSelectedUser(u); setCurrentScreen("chatView"); }, onEdit: () => setCurrentScreen("editProfile"), lang: lang });
            if (currentScreen === "editProfile") return e(EditProfileScreen, { user: me, onSave: f => { setMe(f); setCurrentScreen("mainFlow"); setActiveTab("profile"); }, onCancel: () => setCurrentScreen("mainFlow"), lang: lang });
            if (currentScreen === "chatView" && selectedUser) return e(SingleChatView, { user: selectedUser, messages: msgs[selectedUser.id] || [], onBack: () => setCurrentScreen("mainFlow"), onSend: t => setMsgs(p => ({ ...p, [selectedUser.id]: [...(p[selectedUser.id] || []), { id: Date.now(), from: "me", text: t, time: "12:05" }] })), lang: lang });

            switch (activeTab) {
              case "feed": return e(FeedScreen, { users: users, favIds: favIds, onToggleFav: id => setFavIds(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]), onSelectUser: u => { setSelectedUser(u); setCurrentScreen("viewProfile"); }, lang: lang, onLangToggle: () => setCurrentScreen("langSelect"), me: me, onSelectMyProfile: () => { setSelectedUser(me); setCurrentScreen("viewProfile"); } });
              case "map": return e(MapScreen, { users: users, onSelectUser: u => { setSelectedUser(u); setCurrentScreen("viewProfile"); }, lang: lang });
              case "housing": return e(HousingScreen, { users: users, onSelectUser: u => { setSelectedUser(u); setCurrentScreen("viewProfile"); }, lang: lang });
              case "messages": return e(ChatsScreen, { users: users, msgs: msgs, onOpenChat: u => { setSelectedUser(u); setCurrentScreen("chatView"); }, lang: lang });
              case "profile": return e(UserProfileView, { user: me, isSelf: true, lang: lang, onEdit: () => setCurrentScreen("editProfile"), onBack: () => setActiveTab("feed") });
              default: return null;
            }
          };

          const showBottomMenu = currentScreen === "mainFlow";

          return e('div', { style: { display: "flex", justifyContent: "center", minHeight: "100vh" } },
            e('div', { style: { width: "100%", maxWidth: 430, height: "100vh", position: "relative", overflow: "hidden", display: "flex", flexDirection: "column", paddingBottom: showBottomMenu ? "80px" : "0", boxShadow: "0 0 30px rgba(0,0,0,0.5)" } },
              renderMainContent(),
              showBottomMenu ? e(BottomNavigationBar, { activeTab: activeTab, onTabChange: id => setActiveTab(id) }) : null
            )
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(e(App));
    </script>
</body>
</html>
