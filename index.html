            if (scr === "msgList") return e(MsgList, { users: users, msgs: msgs, onBack: () => setScr("feed"), onChat: doChat, lang: lang, changeLang: () => setLang(null) });

            return null;
          };

          return e('div', { style: { display: "flex", justifyContent: "center", minHeight: "100vh", background: "#060411" } },
            e('div', { style: { width: "100%", maxWidth: 430, height: "100vh", overflow: "hidden", position: "relative", paddingBottom: showNav ? "60px" : "0" } },
              render(),

            )
          );
        }

        const W = { display: "flex", flexDirection: "column", height: "100vh", background: BG, color: "#fff", boxSizing: "border-box" };
        const SC = { overflowY: "auto", flex: 1, paddingBottom: 80 };
        const IS = { width: "100%", padding: "11px 14px", background: "rgba(255,255,255,.07)", border: "1px solid rgba(255,255,255,.12)", borderRadius: 10, color: "#fff", fontSize: 14, outline: "none", boxSizing:"border-box", marginBottom: 6 };

        const root = ReactDOM.createRoot(document.getElementById('root'));

    </script>
