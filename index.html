<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeUp Network</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body style="margin: 0; background: #060411; font-family: sans-serif; color: #fff;">
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;
        const e = React.createElement;

        // ═══════════════════════════════════════════════════════════════
        // СЛОВАРИ ДЛЯ ЛОКАЛИЗАЦИИ (ЯЗЫКИ)
        // ═══════════════════════════════════════════════════════════════
        const TRANSLATIONS = {
          ua: {
            selectLang: "Виберіть мову", login: "Увійти", register: "Реєстрація", namePlh: "Ваше ім'я",
            phonePlh: "Телефон або email", passPlh: "Пароль", btnReg: "ЗАРЕЄСТРУВАТИСЯ", btnIn: "УВІЙТИ",
            searchPlh: "🔍 Пошук людей або тегів...", aboutProj: "ℹ Про проєкт", mapDev: "🗺️ Карта в розробці",
            searchEmpty: "🔍 Пошук порожній", aboutTitle: "Про проєкт", aboutDesc: "Платформа для пошуку хостів та попутників.",
            msgPlh: "Повідомлення...", send: "Відправити", editTitle: "Редагувати", done: "Готово",
            nameLbl: "Ім'я", aboutLbl: "Про себе", statusLbl: "Статуси", messagesTitle: "Повідомлення",
            mapTitle: "Карта", searchTitle: "Пошук", newUserBio: "Новий користувач", ukraine: "Україна",
            kharkiv: "Україна, Харків", kyiv: "Україна, Київ", boryspil: "Україна, Бориспіль", irpin: "Україна, Ірпінь",
            odesa: "Україна, Одеса", dnipro: "Україна, Дніпро", designer: "Дизайнер"
          },
          ru: {
            selectLang: "Выберите язык", login: "Войти", register: "Регистрация", namePlh: "Ваше имя",
            phonePlh: "Телефон или email", passPlh: "Пароль", btnReg: "ЗАРЕГИСТРИРОВАТЬСЯ", btnIn: "ВОЙТИ",
            searchPlh: "🔍 Поиск людей или тегов...", aboutProj: "ℹ О проекте", mapDev: "🗺️ Карта в разработке",
            searchEmpty: "🔍 Поиск пуст", aboutTitle: "О проекте", aboutDesc: "Платформа для поиска хостов и попутчиков.",
            msgPlh: "Сообщение...", send: "Отправить", editTitle: "Редактировать", done: "Готово",
            nameLbl: "Имя", aboutLbl: "О себе", statusLbl: "Статусы", messagesTitle: "Сообщения",
            mapTitle: "Карта", searchTitle: "Поиск", newUserBio: "Новый пользователь", ukraine: "Украина",
            kharkiv: "Украина, Харьков", kyiv: "Украина, Киев", boryspil: "Украина, Борисполь", irpin: "Украина, Ирпень",
            odesa: "Украина, Одесса", dnipro: "Украина, Днепр", designer: "Дизайнер"
          },
          en: {
            selectLang: "Select Language", login: "Login", register: "Register", namePlh: "Your Name",
            phonePlh: "Phone or email", passPlh: "Password", btnReg: "SIGN UP", btnIn: "LOG IN",
            searchPlh: "🔍 Search users or tags...", aboutProj: "ℹ About project", mapDev: "🗺️ Map under development",
            searchEmpty: "🔍 Search is empty", aboutTitle: "About Project", aboutDesc: "A platform for finding hosts and travel companions.",
            msgPlh: "Message...", send: "Send", editTitle: "Edit Profile", done: "Done",
            nameLbl: "Name", aboutLbl: "About me", statusLbl: "Statuses", messagesTitle: "Messages",
            mapTitle: "Map", searchTitle: "Search", newUserBio: "New User", ukraine: "Ukraine",
            kharkiv: "Ukraine, Kharkiv", kyiv: "Ukraine, Kyiv", boryspil: "Ukraine, Boryspil", irpin: "Ukraine, Irpin",
            odesa: "Ukraine, Odesa", dnipro: "Ukraine, Dnipro", designer: "Designer"
          },
          de: {
            selectLang: "Sprache auswählen", login: "Einloggen", register: "Registrieren", namePlh: "Ihr Name",
            phonePlh: "Telefon oder E-Mail", passPlh: "Passwort", btnReg: "REGISTRIEREN", btnIn: "EINLOGGEN",
            searchPlh: "🔍 Benutzer oder Tags suchen...", aboutProj: "ℹ Über das Projekt", mapDev: "🗺️ Karte in Entwicklung",
            searchEmpty: "🔍 Suche ist leer", aboutTitle: "Über das Projekt", aboutDesc: "Eine Plattform zur Suche nach Gastgebern und Reisepartnern.",
            msgPlh: "Nachricht...", send: "Senden", editTitle: "Profil bearbeiten", done: "Fertig",
            nameLbl: "Name", aboutLbl: "Über mich", statusLbl: "Status", messagesTitle: "Nachrichten",
            mapTitle: "Karte", searchTitle: "Suche", newUserBio: "Neuer Benutzer", ukraine: "Ukraine",
            kharkiv: "Ukraine, Charkiw", kyiv: "Ukraine, Kiew", boryspil: "Ukraine, Boryspil", irpin: "Ukraine, Irpin",
            odesa: "Ukraine, Odessa", dnipro: "Ukraine, Dnipro", designer: "Designer"
          }
        };

        const TC = "#00bfb3"; 
        const BG = "linear-gradient(160deg,#1a0533 0%,#0d1f3c 100%)";

        // ═══════════════════════════════════════════════════════════════
        // КОМПОНЕНТ СТАРТОВОГО ВЫБОРА ЯЗЫКА
        // ═══════════════════════════════════════════════════════════════
        function LangSelect({ onSelect }) {
          const langs = [
            {code: "ua", name: "🇺🇦 Українська"},
            {code: "ru", name: "🇷🇺 Русский"},
            {code: "en", name: "🇬🇧 English"},
            {code: "de", name: "🇩🇪 Deutsch"}
          ];

          return e('div', { style: { minHeight: "100vh", background: "linear-gradient(135deg,#1a0533,#2d1060,#0f2a4a)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, boxSizing: "border-box" } },
            e('div', { style: { width: "100%", maxWidth: 340, background: "rgba(255,255,255,.04)", border: "1px solid rgba(255,255,255,.12)", borderRadius: 40, padding: "38px 28px 30px", backdropFilter: "blur(20px)", textAlign: "center" } },
              e('div', { style: { marginBottom: 26 } },
                e('span', { style: { border: "2px solid " + TC, padding: "5px 10px", fontSize: 24, fontWeight: 800, color: TC, borderRadius: "6px 0 0 6px" } }, "LIFE"),
                e('span', { style: { background: TC, padding: "5px 10px", fontSize: 24, fontWeight: 800, color: "#fff", borderRadius: "0 6px 6px 0" } }, "UP")
              ),
              e('h3', { style: { color: "#fff", marginBottom: 20, fontSize: 16 } }, "Select Language / Виберіть мову"),
              e('div', { style: { display: "flex", flexDirection: "column", gap: 12 } },
                langs.map(l => e('button', {
                  key: l.code,
                  onClick: () => onSelect(l.code),
                  style: { width: "100%", padding: "13px 0", background: "rgba(255,255,255,.08)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 12, color: "#fff", fontSize: 16, fontWeight: 600, cursor: "pointer" }
                }, l.name))
              )
            )
          );
        }

        // ═══════════════════════════════════════════════════════════════
        // КОМПОНЕНТ РЕГИСТРАЦИИ
        // ═══════════════════════════════════════════════════════════════
        function Register({ onDone, lang }) {
          const t = TRANSLATIONS[lang];
          const [name, setName] = useState("");

          return e('div', { style: { minHeight: "100vh", background: "linear-gradient(135deg,#1a0533,#2d1060,#0f2a4a)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, boxSizing: "border-box" } },
            e('div', { style: { width: "100%", maxWidth: 340, background: "rgba(255,255,255,.04)", border: "1px solid rgba(255,255,255,.12)", borderRadius: 40, padding: "38px 28px 30px", backdropFilter: "blur(20px)" } },
              e('div', { style: { textAlign: "center", marginBottom: 26 } },
                e('span', { style: { border: "2px solid " + TC, padding: "5px 10px", fontSize: 24, fontWeight: 800, color: TC, borderRadius: "6px 0 0 6px" } }, "LIFE"),
                e('span', { style: { background: TC, padding: "5px 10px", fontSize: 24, fontWeight: 800, color: "#fff", borderRadius: "0 6px 6px 0" } }, "UP")
              ),
              e('div', { style: { marginBottom: 15, fontSize: 18, textAlign: 'center', fontWeight: 'bold' } }, t.register),
              e('input', {
                placeholder: t.namePlh,
                value: name,
                onChange: e => setName(e.target.value),
                style: { width: "100%", padding: "11px 14px", background: "rgba(255,255,255,.07)", border: "1px solid rgba(255,255,255,.12)", borderRadius: 10, color: "#fff", fontSize: 14, outline: "none", marginBottom: 15, boxSizing: "border-box" }
              }),
              e('button', {
                onClick: () => onDone(name || "User"),
                style: { width: "100%", padding: "13px 0", background: TC, border: "none", borderRadius: 12, color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer" }
              }, t.btnReg)
            )
          );
        }

        // ═══════════════════════════════════════════════════════════════
        // ГЛАВНЫЙ ЭКРАН ПРИЛОЖЕНИЯ
        // ═══════════════════════════════════════════════════════════════
        function MainFeed({ me, lang, onLogout }) {
          const t = TRANSLATIONS[lang];
          return e('div', { style: { display: "flex", flexDirection: "column", height: "100vh", background: BG, padding: 20, boxSizing: "border-box" } },
            e('div', { style: { display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid rgba(255,255,255,0.1)", paddingBottom: 15 } },
              e('div', null,
                e('span', { style: { fontSize: 20, fontWeight: 'bold', color: TC } }, "LIFE"),
                e('span', { style: { fontSize: 20, fontWeight: 'bold', color: "#fff" } }, "UP")
              ),
              e('button', { onClick: onLogout, style: { background: "rgba(255,255,255,0.1)", border: "none", color: "#fff", padding: "6px 12px", borderRadius: 8, cursor: "pointer" } }, "🌐 Мова/Язык")
            ),
            e('div', { style: { marginTop: 30, textAlign: 'center' } },
              e('div', { style: { width: 80, height: 80, borderRadius: "50%", background: TC, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, margin: "0 auto 15px", fontWeight: 'bold' } }, me.name[0].toUpperCase()),
              e('h2', { style: { margin: 0 } }, me.name),
              e('p', { style: { color: "rgba(255,255,255,0.5)", fontSize: 14 } }, me.location),
              e('div', { style: { background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", padding: 20, borderRadius: 16, marginTop: 20, textAlign: 'left' } },
                e('h4', { style: { margin: "0 0 10px 0", color: TC } }, t.aboutTitle),
                e('p', { style: { margin: 0, fontSize: 14, color: "rgba(255,255,255,0.8)", lineHeight: 1.5 } }, t.aboutDesc)
              )
            )
          );
        }

        // ═══════════════════════════════════════════════════════════════
        // КОРНЕВОЙ КОМПОНЕНТ ПРИЛОЖЕНИЯ
        // ═══════════════════════════════════════════════════════════════
        function App() {
          const [lang, setLang] = useState(null);
          const [me, setMe] = useState(null);

          const doRegister = (name) => {
            const loc = lang ? TRANSLATIONS[lang].ukraine : "Ukraine";
            setMe({ name: name, location: loc });
          };

          if (!lang) {
            return e(LangSelect, { onSelect: (code) => setLang(code) });
          }

          if (!me) {
            return e(Register, { onDone: doRegister, lang: lang });
          }

          return e(MainFeed, { me: me, lang: lang, onLogout: () => { setLang(null); setMe(null); } });
        }

        // Чистый запуск React 18 без багов
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(e(App));
    </script>
</body>
</html>
