<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeUp Network - Perfect MVP</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap');

        :root {
            --bg-dark: #060411;
            --bg-shell: #0b0816;
            --accent: #00bfb3;
            --accent-glow: rgba(0, 191, 179, 0.4);
            --card-bg: #1a0533;
            --text-white: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: rgba(255, 255, 255, 0.08);
            --map-water: #0d2142;
            --map-land: #121021;
            --map-green: #1a2e25;
            --map-road: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-white); font-family: 'DM Sans', sans-serif; overflow: hidden; }

        .app-shell { width: 100%; max-width: 430px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg-shell); position: relative; overflow: hidden; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .bottom-nav { position: absolute; bottom: 25px; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 0 16px; z-index: 200; }
        .nav-container { width: 100%; background: rgba(10, 6, 22, 0.96); border: 1px solid rgba(0, 191, 179, 0.25); border-radius: 24px; display: flex; justify-content: space-around; padding: 8px; align-items: center; backdrop-filter: blur(20px); }
        .nav-item-btn { background: none; border: none; font-size: 18px; width: 44px; height: 44px; border-radius: 12px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .nav-item-btn.active { background: var(--accent); color: #fff; box-shadow: 0 4px 10px var(--accent-glow); }
        .nav-item-btn.main-btn { width: 56px; height: 56px; border-radius: 18px; font-size: 24px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
        .nav-item-btn.main-btn.active { background: var(--accent); }

        .content-view { flex: 1; overflow-y: auto; padding-bottom: 110px; }
        .header-section { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); background: rgba(11, 8, 22, 0.95); z-index: 50; }
        
        .user-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; }
        .user-card:active { background: rgba(255,255,255,0.05); }
        
        .custom-input { width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); border-radius: 12px; color: #fff; font-size: 14px; outline: none; margin-bottom: 10px; }
        .custom-input:focus { border-color: var(--accent); }
        .action-button { width: 100%; padding: 14px; background: linear-gradient(90deg, var(--accent), #007a75); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .action-button:active { opacity: 0.8; }

        .map-canvas { width: 100%; height: 100%; position: absolute; background-color: var(--map-land); overflow: hidden; }
        .map-river { position: absolute; background: var(--map-water); opacity: 0.6; filter: blur(2px); }
        .map-road { position: absolute; background: var(--map-road); }
        .map-green { position: absolute; background: var(--map-green); opacity: 0.5; filter: blur(3px); }
        
        .map-label { position: absolute; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(255, 255, 255, 0.3); text-transform: uppercase; padding: 2px 5px; background: rgba(0,0,0,0.5); border-radius: 4px; pointer-events: none; }
        .map-marker { position: absolute; display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; transform: translate(-50%, -100%); transition: transform 0.2s; }
        .map-marker:active { transform: translate(-50%, -100%) scale(1.1); }
        .marker-pin { width: 20px; height: 20px; background: var(--accent); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px var(--accent-glow); border: 1px solid rgba(255,255,255,0.4); }
        .marker-icon { transform: rotate(45deg); font-size: 10px; }
        .marker-label { background: rgba(10, 6, 22, 0.95); padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; margin-top: 4px; border: 1px solid var(--border-color); white-space: nowrap; }

        @keyframes pulseGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; transform: scale(1.1); } }
        .splash { position: absolute; top:0; left:0; width:100%; height:100%; background: #0b0816; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>
    <div id="root">
        <div class="splash">
            <h1 style="color:#00bfb3; font-size: 32px; letter-spacing: 2px;">LIFEUP</h1>
            <p style="color: rgba(255,255,255,0.5); margin-top: 10px;">Network Core Loading...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2Nik3YtyAgYcsww6qxKFHtNDzSESj5CA",
            authDomain: "lifeup-app-30174.firebaseapp.com",
            projectId: "lifeup-app-30174",
            storageBucket: "lifeup-app-30174.firebasestorage.app",
            messagingSenderId: "190784130204",
            appId: "1:190784130204:web:9d524aab073673146cb159"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const { useState, useEffect } = React;
        const e = React.createElement;

        const generateMassiveData = () => {
            const data = [];
            const names = ["Алиса", "Андрей", "Евгений", "Александра", "Дмитрий", "Мария", "Сергей", "Елена", "Игорь", "Анна", "Владимир", "Ольга", "Ярослав", "Виктория", "Руслан", "Светлана", "Денис", "Ирина", "Артем", "Татьяна"];
            const surnames = ["Шевченко", "Мотьков", "Савченко", "Коваль", "Петренко", "Кравченко", "Бойко", "Василенко", "Ткаченко", "Мельник", "Бондаренко", "Олейник", "Ткачук", "Лысенко", "Романенко"];
            const locations = ["Подол", "Печерск", "Оболонь", "Голосеево", "Троещина", "Позняки", "Дарница", "Святошино", "Центр"];
            const jobs = ["UX Designer", "iOS Dev", "Photographer", "Logistics", "Yoga Teacher", "Founder", "Digital Marketer", "Copywriter", "Java Engineer"];

            for (let i = 0; i < 150; i++) {
                data.push({
                    id: `gen_${i}`,
                    name: `${names[i % names.length]} ${surnames[i % surnames.length]}`,
                    location: `Киев, ${locations[i % locations.length]}`,
                    occupation: jobs[i % jobs.length],
                    bio: "Открыт к новым знакомствам, путешествиям и совместным проектам. В LifeUP с самого старта.",
                    isHost: i % 4 === 0,
                    canDrive: i % 5 === 0,
                    social: { insta: `user_${i}`, tg: `@user_${i}`, wa: "+380500000000" }
                });
            }
            return data;
        };
        const TRANSLATIONS = {
            ua: {
                feed: "Стрічка", map: "Карта", housing: "Житло", messages: "Чати", profile: "Профіль",
                searchPlh: "🔍 Пошук за ім'ям або локацією...", empty: "База порожня",
                namePlh: "Ваше ім'я", phonePlh: "Телефон / Email", passPlh: "Пароль",
                btnReg: "УВІЙТИ АБО ЗАРЕЄСТРУВАТИСЯ", btnMsg: "Написати повідомлення",
                hostBadge: "ХОСТ", back: "← Назад", housingTitle: "Couchsurfing & Житло",
                mapDesc: "Радар: Використовуйте джойстик для навігації", socialTitle: "Контакти",
                editBtn: "✎ Редагувати", saveBtn: "Зберегти"
            },
            ru: {
                feed: "Лента", map: "Карта", housing: "Жилье", messages: "Чаты", profile: "Профиль",
                searchPlh: "🔍 Поиск по имени или локации...", empty: "База пуста",
                namePlh: "Ваше имя", phonePlh: "Телефон / Email", passPlh: "Пароль",
                btnReg: "ВОЙТИ ИЛИ ЗАРЕГИСТРИРОВАТЬСЯ", btnMsg: "Написать сообщение",
                hostBadge: "ХОСТ", back: "← Назад", housingTitle: "Couchsurfing & Жилье",
                mapDesc: "Радар: Используйте джойстик для навигации", socialTitle: "Контакты",
                editBtn: "✎ Редактировать", saveBtn: "Сохранить"
            }
        };

        const AVATAR_POOL = [
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&q=80",
            "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&q=80",
            "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=120&q=80",
            "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&q=80",
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&q=80"
        ];

        function Avatar({ user, size = 48 }) {
            const sum = user?.name ? user.name.split('').reduce((a, c) => a + c.charCodeAt(0), 0) : 0;
            return e('img', { 
                src: AVATAR_POOL[sum % AVATAR_POOL.length], 
                style: { width: size, height: size, borderRadius: "50%", objectFit: "cover", flexShrink: 0, border: "2px solid rgba(255,255,255,.15)" } 
            });
        }

        const Logo = () => e('div', { style: { display: "flex", alignItems: "center", gap: 6 } },
            e('span', { style: { background: `linear-gradient(90deg, #007a75, #00bfb3)`, padding: "6px 12px", fontSize: 15, fontWeight: 900, color: "#fff", borderRadius: 8, letterSpacing: "1px" } }, "LIFEUP"),
            e('div', { style: { width: 6, height: 6, borderRadius: "50%", background: "#10b981", boxShadow: "0 0 8px #10b981", animation: "pulseGlow 1.5s infinite" } })
        );

        const BottomNav = ({ view, setView }) => {
            const items = [{ id: "map", i: "📍" }, { id: "housing", i: "🔑" }, { id: "feed", i: "🏠", main: true }, { id: "messages", i: "✉" }, { id: "profile", i: "👤" }];
            return e('div', { className: 'bottom-nav' },
                e('div', { className: 'nav-container' },
                    items.map(n => e('button', { key: n.id, className: `nav-item-btn ${n.main ? 'main-btn' : ''} ${view === n.id ? 'active' : ''}`, onClick: () => setView(n.id) }, n.i))
                )
            );
        };

        const Header = ({ title, leftBtn, rightBtn, lang, onLangToggle }) => e('div', { className: 'header-section' },
            leftBtn || e('div', { style: { width: 40 } }),
            typeof title === 'string' ? e('span', { style: { fontSize: 16, fontWeight: 700 } }, title) : title,
            e('div', { style: { display: "flex", gap: 8, alignItems: "center", width: 80, justifyContent: "flex-end" } },
                onLangToggle && e('button', { onClick: onLangToggle, style: { background: "rgba(255,255,255,0.1)", border: "none", color: "#fff", padding: "6px 10px", borderRadius: 8, fontSize: 11, fontWeight: 700 } }, lang.toUpperCase()),
                rightBtn
            )
        );
        function AuthScreen({ onDone, t }) {
            const [name, setName] = useState("");
            const [phone, setPhone] = useState("");
            return e('div', { className: 'app-shell', style: { justifyContent: "center", padding: 24 } },
                e('div', { style: { textAlign: "center", marginBottom: 40 } }, e(Logo)),
                e('input', { className: 'custom-input', placeholder: t.namePlh, value: name, onChange: e => setName(e.target.value) }),
                e('input', { className: 'custom-input', placeholder: t.phonePlh, value: phone, onChange: e => setPhone(e.target.value) }),
                e('input', { className: 'custom-input', placeholder: t.passPlh, type: "password" }),
                e('button', { className: 'action-button', style: { marginTop: 10 }, onClick: () => onDone(name || "Новый Пользователь", phone) }, t.btnReg)
            );
        }

        function FeedScreen({ users, onSelect, t }) {
            const [q, setQ] = useState("");
            const filtered = users.filter(u => u.name.toLowerCase().includes(q.toLowerCase()) || u.location.toLowerCase().includes(q.toLowerCase()));
            
            return e('div', { className: 'content-view' },
                e('div', { style: { padding: "12px 16px" } }, e('input', { className: 'custom-input', placeholder: t.searchPlh, value: q, onChange: e => setQ(e.target.value), style: { margin: 0 } })),
                filtered.map(u => e('div', { key: u.id, className: 'user-card', onClick: () => onSelect(u) },
                    e(Avatar, { user: u }),
                    e('div', { style: { flex: 1, minWidth: 0 } },
                        e('div', { style: { fontWeight: 700, fontSize: 14, display: "flex", gap: 6, alignItems: "center" } }, 
                            u.name, 
                            u.isHost && e('span', { style: { background: "#f59e0b", color: "#fff", fontSize: 9, padding: "2px 6px", borderRadius: 4 } }, t.hostBadge)
                        ),
                        e('p', { style: { fontSize: 12, color: "var(--accent)", margin: "4px 0" } }, u.location),
                        e('p', { style: { fontSize: 12, color: "rgba(255,255,255,0.4)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, u.occupation)
                    )
                ))
            );
        }

        function HousingScreen({ users, onSelect, t }) {
            const hosts = users.filter(u => u.isHost);
            return e('div', { className: 'content-view', style: { padding: 16 } },
                e('h3', { style: { color: "var(--accent)", marginBottom: 16 } }, t.housingTitle),
                hosts.map(u => e('div', { key: u.id, onClick: () => onSelect(u), style: { background: "rgba(255,255,255,0.03)", border: "1px solid var(--border-color)", padding: 16, borderRadius: 16, marginBottom: 12, cursor: "pointer" } },
                    e('h4', { style: { marginBottom: 8, fontSize: 15 } }, `Жилье от: ${u.name}`),
                    e('p', { style: { fontSize: 12, opacity: 0.7, marginBottom: 12 } }, `📍 ${u.location}`),
                    e('button', { className: 'action-button', style: { padding: "10px", fontSize: 13, background: "rgba(0,191,179,0.1)", border: "1px solid var(--accent)", color: "var(--accent)" } }, "Смотреть профиль")
                ))
            );
        }
        function DrawnMapScreen({ users, onSelectUser, t }) {
            const [coords, setCoords] = useState({ x: 0, y: 0 });
            const [zoom, setZoom] = useState(1);

            return e('div', { style: { flex: 1, position: "relative", overflow: "hidden" } },
                e('div', { style: { position: "absolute", zIndex: 100, top: 10, left: "50%", transform: "translateX(-50%)", background: "rgba(0,0,0,0.6)", padding: "4px 12px", borderRadius: 12, fontSize: 11, color: "rgba(255,255,255,0.7)" } }, t.mapDesc),
                
                // Навигация (Джойстик)
                e('div', { style: { position: "absolute", bottom: 120, left: 16, display: "grid", gridTemplateColumns: "repeat(3, 36px)", gap: 4, zIndex: 150 } },
                    e('div'), e('button', { onClick: () => setCoords(c => ({ ...c, y: c.y + 80 })), style: { background: "rgba(10,6,22,0.8)", border: "1px solid rgba(255,255,255,0.1)", color: "#fff", borderRadius: 8, height: 32 } }, "↑"), e('div'),
                    e('button', { onClick: () => setCoords(c => ({ ...c, x: c.x + 80 })), style: { background: "rgba(10,6,22,0.8)", border: "1px solid rgba(255,255,255,0.1)", color: "#fff", borderRadius: 8, height: 32 } }, "←"), e('div'), e('button', { onClick: () => setCoords(c => ({ ...c, x: c.x - 80 })), style: { background: "rgba(10,6,22,0.8)", border: "1px solid rgba(255,255,255,0.1)", color: "#fff", borderRadius: 8, height: 32 } }, "→"),
                    e('div'), e('button', { onClick: () => setCoords(c => ({ ...c, y: c.y - 80 })), style: { background: "rgba(10,6,22,0.8)", border: "1px solid rgba(255,255,255,0.1)", color: "#fff", borderRadius: 8, height: 32 } }, "↓")
                ),

                // Зум
                e('div', { style: { position: "absolute", bottom: 120, right: 16, display: "flex", flexDirection: "column", gap: 6, zIndex: 150 } },
                    e('button', { onClick: () => setZoom(z => Math.min(z + 0.3, 2.5)), style: { width: 44, height: 44, background: "rgba(255,255,255,0.1)", border: "1px solid var(--accent)", color: "#fff", fontSize: 20, borderRadius: 14 } }, "+"),
                    e('button', { onClick: () => setZoom(z => Math.max(z - 0.3, 0.7)), style: { width: 44, height: 44, background: "rgba(255,255,255,0.1)", border: "1px solid var(--accent)", color: "#fff", fontSize: 20, borderRadius: 14 } }, "−")
                ),

                e('div', { className: 'map-canvas', style: { transform: `translate(${coords.x}px, ${coords.y}px) scale(${zoom})`, transition: "transform 0.2s" } },
                    // Графика карты
                    e('div', { className: 'map-river', style: { width: "140px", height: "120%", top: "-10%", left: "55%", transform: "rotate(-8deg)" } }),
                    e('div', { className: 'map-green', style: { width: "180px", height: "180px", bottom: "-20px", left: "10%", borderRadius: "50px" } }),
                    e('div', { className: 'map-road', style: { width: "100%", height: "3px", top: "45%", left: 0, opacity: 0.1 } }),
                    
                    // Районы
                    e('div', { className: 'map-label', style: { top: "15%", left: "30%" } }, "ОБОЛОНЬ"),
                    e('div', { className: 'map-label', style: { top: "45%", left: "35%" } }, "ПОДОЛ"),
                    e('div', { className: 'map-label', style: { top: "55%", left: "20%" } }, "ЦЕНТР"),
                    e('div', { className: 'map-label', style: { top: "60%", left: "50%" } }, "ПЕЧЕРСК"),
                    e('div', { className: 'map-label', style: { top: "20%", left: "70%" } }, "ТРОЕЩИНА"),
                    e('div', { className: 'map-label', style: { top: "75%", left: "75%" } }, "ПОЗНЯКИ"),

                    // Маркеры (Отображаем только первые 40, чтобы не перегружать экран визуально)
                    users.slice(0, 40).map((u, i) => {
                        let tY = 50, tX = 50;
                        if (u.location.includes("Оболонь")) { tY = 15 + (i%15); tX = 25 + (i%15); }
                        else if (u.location.includes("Подол")) { tY = 40 + (i%10); tX = 30 + (i%15); }
                        else if (u.location.includes("Печерск")) { tY = 55 + (i%10); tX = 45 + (i%15); }
                        else if (u.location.includes("Центр")) { tY = 50 + (i%10); tX = 20 + (i%15); }
                        else if (u.location.includes("Троещина")) { tY = 15 + (i%15); tX = 65 + (i%15); }
                        else if (u.location.includes("Позняки")) { tY = 65 + (i%15); tX = 70 + (i%15); }
                        else { tY = 30 + (i%40); tX = 10 + (i%80); }

                        return e('div', { key: u.id, className: 'map-marker', style: { top: `${tY}%`, left: `${tX}%` }, onClick: () => onSelectUser(u) },
                            e('div', { className: 'marker-pin' }, e('span', { className: 'marker-icon' }, u.isHost ? "🏠" : "👤")),
                            e('div', { className: 'marker-label' }, u.name.split(" ")[0])
                        );
                    })
                )
            );
        }

        function MessagesScreen({ users, onSelect, t }) {
            const chats = users.slice(0, 15).map((u, i) => ({ user: u, text: i % 2 === 0 ? "Привет, смотрел профиль!" : "Актуально жилье?" }));
            return e('div', { className: 'content-view' },
                chats.map((c, i) => e('div', { key: i, className: 'user-card', onClick: () => onSelect(c.user) },
                    e(Avatar, { user: c.user }),
                    e('div', { style: { flex: 1 } }, e('div', { style: { fontWeight: 700, fontSize: 14 } }, c.user.name), e('p', { style: { fontSize: 12, opacity: 0.6, marginTop: 4 } }, c.text))
                ))
            );
        }
        function ProfileScreen({ user, isSelf, back, onChat, onEdit, t }) {
            return e('div', { className: 'content-view', style: { padding: 20 } },
                e('div', { style: { display: "flex", gap: 16, alignItems: "center", marginBottom: 24 } },
                    e(Avatar, { user, size: 72 }),
                    e('div', null, e('h2', { style: { fontSize: 20, marginBottom: 4 } }, user.name), e('div', { style: { color: "var(--accent)", fontSize: 13, fontWeight: 600 } }, user.location))
                ),
                !isSelf && e('button', { className: 'action-button', style: { marginBottom: 20 }, onClick: onChat }, t.btnMsg),
                e('div', { style: { background: "rgba(255,255,255,0.03)", padding: 16, borderRadius: 16, border: "1px solid var(--border-color)", marginBottom: 20, fontSize: 14, lineHeight: 1.6 } }, user.bio),
                e('h4', { style: { color: "var(--accent)", marginBottom: 12, textTransform: "uppercase", fontSize: 11 } }, t.socialTitle),
                e('div', { style: { display: "flex", flexDirection: "column", gap: 8 } },
                    e('div', { style: { background: "rgba(0,0,0,0.3)", padding: 12, borderRadius: 10, fontSize: 13 } }, `📸 Instagram: @${user.social?.insta || 'hidden'}`),
                    e('div', { style: { background: "rgba(0,0,0,0.3)", padding: 12, borderRadius: 10, fontSize: 13 } }, `✈️ Telegram: ${user.social?.tg || 'hidden'}`)
                )
            );
        }

        function App() {
            const [lang, setLang] = useState('ru');
            const [users, setUsers] = useState(generateMassiveData());
            const [me, setMe] = useState(null);
            const [view, setView] = useState('auth');
            const [selectedUser, setSelectedUser] = useState(null);
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                if (db) {
                    db.collection("users").limit(100).onSnapshot(snap => {
                        if (!snap.empty) {
                            const l = []; snap.forEach(d => l.push({ id: d.id, ...d.data() }));
                            setUsers(prev => [...l, ...prev.slice(l.length)]);
                        }
                    });
                }
            }, []);

            const login = (name, phone) => {
                const newMe = { id: `user_${Date.now()}`, name, location: "Киев", occupation: "Founder", bio: "Готов к запуску MVP", isHost: true, social: { wa: phone } };
                if(db) db.collection("users").doc(newMe.id).set(newMe).catch(()=>{});
                setMe(newMe);
                setView('feed');
            };

            const renderMain = () => {
                if (selectedUser) return e(ProfileScreen, { user: selectedUser, isSelf: selectedUser.id === me?.id, back: () => setSelectedUser(null), onChat: () => { setSelectedUser(null); setView('messages'); }, t });
                
                switch (view) {
                    case 'feed': return e(FeedScreen, { users, onSelect: setSelectedUser, t });
                    case 'map': return e(DrawnMapScreen, { users, onSelectUser: setSelectedUser, t });
                    case 'housing': return e(HousingScreen, { users, onSelect: setSelectedUser, t });
                    case 'messages': return e(MessagesScreen, { users, onSelect: setSelectedUser, t });
                    case 'profile': return e(ProfileScreen, { user: me, isSelf: true, back: () => setView('feed'), t });
                    default: return null;
                }
            };

            if (view === 'auth') return e(AuthScreen, { onDone: login, t });

            const getTitle = () => {
                if (selectedUser) return selectedUser.name;
                if (view === 'map') return e(Logo);
                if (view === 'profile') return t.profile;
                if (view === 'messages') return t.messages;
                if (view === 'housing') return t.housingTitle;
                return e(Logo);
            };

            return e('div', { className: 'app-shell' },
                e(Header, { 
                    title: getTitle(), 
                    lang, 
                    onLangToggle: () => setLang(l => l === 'ru' ? 'ua' : 'ru'),
                    leftBtn: selectedUser ? e('button', { onClick: () => setSelectedUser(null), style: { background: "transparent", color: "#fff", border: "none", fontSize: 14, fontWeight: 700 } }, t.back) : null
                }),
                renderMain(),
                !selectedUser && e(BottomNav, { view, setView })
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
