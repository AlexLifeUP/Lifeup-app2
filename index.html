<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeUp Network - MVP v2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;900&display=swap');
        body { margin: 0; background: #060411; color: #fff; font-family: 'DM Sans', sans-serif; }
        .app-shell { width: 100%; max-width: 430px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: #0b0816; position: relative; }
        .nav-btn { background: #1a0533; border: none; padding: 15px; border-radius: 15px; color: #fff; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .input-field { width: 100%; padding: 15px; background: #1a0533; border: 1px solid #333; border-radius: 10px; color: #fff; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2Nik3YtyAgYcsww6qxKFHtNDzSESj5CA",
            authDomain: "lifeup-app-30174.firebaseapp.com",
            projectId: "lifeup-app-30174",
            storageBucket: "lifeup-app-30174.firebasestorage.app",
            messagingSenderId: "190784130204",
            appId: "1:190784130204:web:9d524aab073673146cb159"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const e = React.createElement;

        const MOCK_DATA = Array.from({length: 30}, (_,i) => ({
            id: String(i),
            name: ["Алиса", "Андрей", "Евгений", "Александра", "Дмитрий"][i%5] + " " + i,
            location: ["Печерск", "Подол", "Оболонь", "Голосеево"][i%4],
            isHost: i % 2 === 0,
            bio: "Привет! Ищу компанию для путешествий по Украине.",
            socialLinks: { insta: "user"+i, tg: "user"+i }
        }));
        const Logo = () => e('div', {style:{padding:20, fontSize:20, fontWeight:900}}, "LIFEUP");
        const Avatar = ({name}) => e('div', {style:{width:50, height:50, borderRadius:25, background:'#00bfb3', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:'bold'}}, name[0]);
        const Nav = ({view, setView}) => e('div', {style:{position:'absolute', bottom:20, left:0, right:0, display:'flex', justifyContent:'space-around', padding:'0 10px'}},
            [{id:'map', i:'📍'}, {id:'housing', i:'🔑'}, {id:'feed', i:'🏠'}, {id:'chat', i:'✉'}, {id:'prof', i:'👤'}].map(n => 
                e('button', {key:n.id, className:'nav-btn', onClick:()=>setView(n.id), style:{background: view===n.id ? '#00bfb3' : '#1a0533'}}, n.i)
            )
        );
        const AuthScreen = ({onLogin}) => e('div', {className:'app-shell', style:{padding:40, justifyContent:'center'}},
            e('h2', null, "Вход в LifeUP"),
            e('input', {className:'input-field', placeholder:'Email / Телефон'}),
            e('input', {className:'input-field', type:'password', placeholder:'Пароль'}),
            e('button', {className:'nav-btn', style:{background:'#00bfb3', width:'100%'}, onClick:onLogin}, "Войти")
        );

        const FeedScreen = ({users, onSelect}) => e('div', {className:'app-shell', style:{paddingBottom:100}},
            e(Logo),
            e('div', {style:{overflowY:'auto'}},
                users.map(u => e('div', {key:u.id, style:{padding:15, margin:10, background:'#1a0533', borderRadius:10, display:'flex', gap:15}, onClick:()=>onSelect(u)},
                    e(Avatar, {name:u.name}),
                    e('div', null, e('h3', {style:{margin:0}}, u.name), e('p', {style:{margin:0, fontSize:12, color:'#888'}}, u.location))
                ))
            )
        );
        const MapScreen = ({users}) => e('div', {className:'app-shell', style:{background:'#050714'}},
            e('div', {style:{padding:20, fontWeight:700}}, "КАРТА КИЕВА"),
            e('div', {style:{flex:1, position:'relative', borderTop:'1px solid #333'}},
                users.map((u, i) => e('div', {key:i, style:{position:'absolute', top:50+i*20+'px', left:50+i*15+'px', background:'#00bfb3', padding:5, borderRadius:8, fontSize:10}}, u.name.split(" ")[0]))
            )
        );

        const HousingScreen = ({users}) => e('div', {className:'app-shell', style:{padding:20}},
            e('h2', null, "Жилье"),
            users.filter(u=>u.isHost).map(u => e('div', {key:u.id, style:{padding:15, background:'#1a0533', borderRadius:10, marginBottom:10}}, 
                e('h3', null, u.name), e('p', null, "Бесплатно в: " + u.location)
            ))
        );
        function App() {
            const [view, setView] = useState('auth');
            const [users, setUsers] = useState(MOCK_DATA);
            const [sel, setSel] = useState(null);

            useEffect(() => {
                db.collection("users").onSnapshot(snap => {
                    const l = []; snap.forEach(d => l.push(d.data()));
                    if(l.length > 0) setUsers(l);
                });
            }, []);

            if (view === 'auth') return e(AuthScreen, {onLogin:()=>setView('feed')});
            
            return e('div', {className:'app-shell'},
                view === 'feed' ? e(FeedScreen, {users, onSelect:(u)=>{setSel(u); setView('prof')}}) : null,
                view === 'map' ? e(MapScreen, {users}) : null,
                view === 'housing' ? e(HousingScreen, {users}) : null,
                view === 'prof' ? e('div', {style:{padding:20}}, e('h1', null, sel?.name), e('button', {className:'nav-btn', onClick:()=>setView('feed')}, "Назад")) : null,
                e(Nav, {active:view, setActive:setView})
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
</body>
</html>
