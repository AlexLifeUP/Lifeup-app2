        function Avatar({ user, size = 48 }) {
          const imgUrl = USER_AVATARS[user?.id % USER_AVATARS.length] || USER_AVATARS[0];
          return e('img', {
            src: imgUrl,
            alt: user?.name,
            style: {
              width: size, height: size, borderRadius: "50%",
              objectFit: "cover", flexShrink: 0,
              border: "2px solid rgba(255,255,255,.15)", boxShadow: "0 2px 6px rgba(0,0,0,0.3)"
            }
          });
        }

        // ОФИЦИАЛЬНЫЙ ЧИСТЫЙ ЛОГОТИП СТАРТАПА LIFEUP С МАКЕТА
        function LogoComponent() {
          return e('div', { style: { display: "flex", alignItems: "center", gap: 6, userSelect: "none" } },
            e('span', { style: { background: `linear-gradient(90deg, ${TD}, ${TC})`, padding: "5px 14px", fontSize: 15, fontWeight: 900, color: "#fff", borderRadius: 10, letterSpacing: "1.5px", boxShadow: `0 0 12px ${TC}60`, border: "1px solid rgba(255,255,255,0.15)" } }, "LIFEUP"),
            e('div', { style: { width: 6, height: 6, borderRadius: "50%", background: "#10b981", boxShadow: "0 0 8px #10b981", animation: "pulse 1.5s infinite" } })
          );
        }

        function HeaderBar({ title, onBack, rightElement, lang, onLangToggle }) {
          return e('div', {
            style: {
              display: "flex", alignItems: "center", justifyBetween: "space-between", padding: "12px 14px", background: "rgba(12, 8, 28, 0.9)",
              borderBottom: `1px solid ${BR}`, flexShrink: 0, zIndex: 5, backdropFilter: "blur(12px)", justifyContent: "space-between"
            }
          },
            e('div', { style: { width: 50, display: "flex", alignItems: "center" } },
              onBack && e('button', { onClick: onBack, style: { background: "rgba(255,255,255,0.06)", border: `1px solid ${BR}`, color: "#fff", fontSize: 13, cursor: "pointer", padding: "6px 12px", borderRadius: 8, fontWeight: 600 } }, "←")
            ),
            typeof title === 'string' ? e('span', { style: { fontSize: 15, fontWeight: 700, color: "#fff" } }, title) : title,
            e('div', { style: { display: "flex", alignItems: "center", gap: 8 } },
              onLangToggle && e('button', { onClick: onLangToggle, style: { background: "rgba(255,255,255,0.1)", border: "none", color: "#fff", padding: "5px 10px", borderRadius: 6, fontSize: 11, fontWeight: 700, cursor: "pointer" } }, lang),
              rightElement || e('div', { style: { width: 20 } })
            )
          );
        }

        function FieldLabel({ text, marginTop = 0 }) {
          return e('label', { style: { display: "block", fontSize: 11, fontWeight: 700, color: TC, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6, marginTop: marginTop } }, text);
        }
        function LangSelectScreen({ onSelect }) {
          return e('div', { style: { minHeight: "100vh", background: "linear-gradient(135deg, #120326, #091326)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 } },

              e('div', { style: { marginBottom: 24, display: "flex", justifyContent: "center" } }, e(LogoComponent)),
              e('div', { style: { display: "flex", flexDirection: "column", gap: 10 } },

              )
            )
          );
        }

        function AuthScreen({ onDone, lang, onBack }) {
          const t = TRANSLATIONS_DATA[lang];
          const [mode, setMode] = useState("login");
          const [name, setName] = useState("");
          const [phone, setPhone] = useState("");
          const [pass, setPass] = useState("");

          return e('div', { style: { minHeight: "100vh", background: "linear-gradient(135deg, #120326, #091326)", display: "flex", flexDirection: "column" } },

                e('input', { type: "password", placeholder: t.passPlh, value: pass, onChange: e => setPass(e.target.value), style: IS }),

              )
            )
          );
        }

        function FeedScreen({ users, favIds, onToggleFav, onSelectUser, lang, onLangToggle, me, onSelectMyProfile }) {
          const t = TRANSLATIONS_DATA[lang];
          const [search, setSearch] = useState("");
          const [activeSubTab, setActiveSubTab] = useState("all");

          const filteredUsers = users.filter(u => {
            if (activeSubTab === "fav" && !favIds.includes(u.id)) return false;
            if (!search.trim()) return true;
            const q = search.toLowerCase();
            return u.name.toLowerCase().includes(q) || u.location.toLowerCase().includes(q) || u.occupation.toLowerCase().includes(q);
          });

          return e('div', { style: { display: "flex", flexDirection: "column", height: "100%" } },
            e('div', { style: { background: "rgba(15, 10, 30, 0.85)", padding: "12px 14px", flexShrink: 0, borderBottom: `1px solid ${BR}` } },

              e('input', { value: search, onChange: e => setSearch(e.target.value), placeholder: t.searchPlh, style: IS }),
