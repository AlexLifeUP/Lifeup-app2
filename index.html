          );
        }

        function FeedScreen({ users, favIds, onToggleFav, onSelectUser, lang, onLangToggle, me, onSelectMyProfile }) {
          const t = TRANSLATIONS_DATA[lang];
          const [search, setSearch] = useState("");
          const [activeSubTab, setActiveSubTab] = useState("all");

          const filteredUsers = users.filter(u => {
            if (activeSubTab === "fav" && !favIds.includes(u.id)) return false;
            if (!search.trim()) return true;
            const q = search.toLowerCase();
            return u.name.toLowerCase().includes(q) || u.location.toLowerCase().includes(q);
          });

          return e('div', { style: { display: "flex", flexDirection: "column", height: "100%" } },
            e('div', { style: { background: "rgba(15, 10, 30, 0.85)", padding: "12px 14px", flexShrink: 0, borderBottom: `1px solid ${BR}` } },
              e('div', { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 } },
                e(LogoComponent),
                e('div', { style: { display: "flex", alignItems: "center", gap: 8 } },
                  e('button', { onClick: onLangToggle, style: { background: "rgba(255,255,255,0.1)", border: "none", color: "#fff", padding: "4px 8px", borderRadius: 6, fontSize: 11, fontWeight: 700 } }, lang),
                  e('div', { onClick: onSelectMyProfile, style: { display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: "rgba(255,255,255,0.06)", padding: "4px 8px", borderRadius: 16 } }, e(Avatar, { user: me, size: 22 }), e('span', { style: { fontSize: 12 } }, me?.name?.split(" ")[0]))
                )
              ),
              e('input', { value: search, onChange: e => setSearch(e.target.value), placeholder: t.searchPlh, style: IS }),
              e('div', { style: { display: "flex", gap: 8, marginTop: 8 } },
                e('button', { onClick: () => setActiveSubTab("all"), style: { flex: 1, padding: "6px 0", background: activeSubTab === "all" ? TC : "rgba(255,255,255,0.04)", border: "none", borderRadius: 8, color: "#fff", fontSize: 12, fontWeight: 600 } }, t.tabsFeed),
                e('button', { onClick: () => setActiveSubTab("fav"), style: { flex: 1, padding: "6px 0", background: activeSubTab === "fav" ? PU : "rgba(255,255,255,0.04)", border: "none", borderRadius: 8, color: "#fff", fontSize: 12, fontWeight: 600 } }, `${t.tabsFav} (${favIds.length})`)
              )
            ),
            e('div', { style: { overflowY: "auto", flex: 1, paddingBottom: 20 } },
              filteredUsers.length === 0 ? e('div', { style: { textAlign: "center", color: "rgba(255,255,255,0.3)", marginTop: 30 } }, t.emptyList) : null,
              filteredUsers.map(u => (
                e('div', { key: u.id, onClick: () => onSelectUser(u), style: { display: "flex", gap: 12, padding: "14px", borderBottom: `1px solid ${BR}`, cursor: "pointer", alignItems: "flex-start" } },
                  e(Avatar, { user: u, size: 48 }),
                  e('div', { style: { flex: 1, minWidth: 0 } },
                    e('div', { style: { fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", gap: 6 } }, u.name, u.isHost && e('span', { style: { fontSize: 9, background: "#f59e0b", color: "#fff", padding: "1px 4px", borderRadius: 4 } }, t.hostBadge)),
                    e('div', { style: { fontSize: 11, color: TC, margin: "2px 0" } }, u.location),
                    e('div', { style: { fontSize: 13, color: "rgba(255,255,255,.6)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, u.bio)
                  ),
                  e('div', { style: { display: "flex", flexDirection: "column", gap: 10, alignItems: "center" } },
                    e('button', { onClick: e => { e.stopPropagation(); onToggleFav(u.id); }, style: { background: "transparent", border: "none", fontSize: 18, color: favIds.includes(u.id) ? "#f59e0b" : "rgba(255,255,255,0.15)" } }, "★"),
                    e('span', { style: { fontSize: 11, color: "#f59e0b", fontWeight: 700 } }, `⭐${u.rating}`)
                  )
                )
              ))
            )
          );
        }

        function MapScreen({ users, onSelectUser, lang }) {
          const t = TRANSLATIONS_DATA[lang];
          return e('div', { style: { display: "flex", flexDirection: "column", height: "100%" } },
            e(HeaderBar, { title: e(LogoComponent), lang: lang }),
            e('div', { style: { flex: 1, position: "relative", overflow: "hidden", background: "radial-gradient(circle, #111a33 0%, #050714 100%)", display: "flex", alignItems: "center", justifyContent: "center" } },
              e('div', { style: { position: "absolute", width: 240, height: 240, border: "1px solid rgba(0,191,179,0.1)", borderRadius: "50%" } }),
              users.map((u, index) => {
                const positions = [ { top: "30%", left: "25%" }, { top: "50%", left: "65%" } ];
                const pos = positions[index % positions.length];
                return e('div', { key: u.id, onClick: () => onSelectUser(u), style: { position: "absolute", top: pos.top, left: pos.left, display: "flex", flexDirection: "column", alignItems: "center", cursor: "pointer" } },
                  e('div', { style: { width: 34, height: 34, borderRadius: "50%", background: getAvatarColor(u.id), border: "2px solid #fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700 } }, getInitials(u.name)),
                  e('div', { style: { background: "rgba(0,0,0,0.7)", padding: "2px 5px", borderRadius: 4, fontSize: 10, marginTop: 3 } }, u.name.split(" ")[0])
                );
              })
            )
          );
        }
        function HousingScreen({ users, onSelectUser, lang }) {
          const t = TRANSLATIONS_DATA[lang];
          const hosts = users.filter(u => u.isHost && u.housingInfo);

          return e('div', { style: { display: "flex", flexDirection: "column", height: "100%" } },
            e(HeaderBar, { title: e(LogoComponent), lang: lang }),
            e('div', { style: { overflowY: "auto", flex: 1, padding: 12 } },
              hosts.map(u => (
                e('div', { key: u.id, onClick: () => onSelectUser(u), style: { background: "rgba(255,255,255,0.02)", border: `1px solid ${BR}`, borderRadius: 14, padding: 12, marginBottom: 12, cursor: "pointer" } },
                  e('div', { style: { fontSize: 14, fontWeight: 700, marginBottom: 4 } }, u.housingInfo.title),
                  e('div', { style: { fontSize: 11, color: "rgba(255,255,255,0.4)" } }, u.location)
                )
              ))
            )
          );
        }

        function ChatsScreen({ users, msgs, onOpenChat, lang }) {
          const t = TRANSLATIONS_DATA[lang];
          const activeChats = users.filter(u => msgs[u.id] && msgs[u.id].length > 0).map(u => ({ user: u, lastMsg: msgs[u.id][msgs[u.id].length - 1] }));

          return e('div', { style: { display: "flex", flexDirection: "column", height: "100%" } },
            e(HeaderBar, { title: t.messages, lang: lang }),
            e('div', { style: { overflowY: "auto", flex: 1 } },
              activeChats.length === 0 ? e('div', { style: { textAlign: "center", color: "rgba(255,255,255,0.2)", marginTop: 40 } }, t.emptyMsgs) : null,
              activeChats.map(({ user, lastMsg }) => (
                e('div', { key: user.id, onClick: () => onOpenChat(user), style: { display: "flex", padding: "12px 14px", borderBottom: `1px solid ${BR}`, cursor: "pointer", alignItems: "center" } },
                  e(Avatar, { user: user, size: 42 }),
                  e('div', { style: { marginLeft: 10, flex: 1, minWidth: 0 } },
                    e('div', { style: { fontWeight: 700, fontSize: 14 } }, user.name),
                    e('div', { style: { fontSize: 12, color: "rgba(255,255,255,0.5)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, lastMsg?.text)
                  )
                )
              ))
            )
          );
        }

        // ЭКРАН ЧАТА С КНОПКОЙ МГНОВЕННОГО ПЕРЕВОДА СООБЩЕНИЙ
        function SingleChatView({ user, messages, onBack, onSend, lang }) {
          const t = TRANSLATIONS_DATA[lang];
          const [text, setText] = useState("");
          const [translatedMsgs, setTranslatedMsgs] = useState({});

          const handleTranslate = (msgId, originalText) => {
            if (translatedMsgs[msgId]) {
              setTranslatedMsgs(prev => ({ ...prev, [msgId]: null }));
            } else {
              const transDB = CHAT_TRANSLATIONS[lang];
              const result = (transDB && transDB[originalText]) || `[Translated to ${lang.toUpperCase()}]: ${originalText}`;
              setTranslatedMsgs(prev => ({ ...prev, [msgId]: result }));
            }
          };

          return e('div', { style: { display: "flex", flexDirection: "column", height: "100%" } },
            e(HeaderBar, { title: user.name, onBack: onBack, lang: lang }),
            e('div', { style: { flex: 1, overflowY: "auto", padding: "14px" } },
              messages.map(m => {
                const isMe = m.from === "me";
                const isTrans = !!translatedMsgs[m.id];
                return e('div', { key: m.id, style: { display: "flex", justifyContent: isMe ? "flex-end" : "flex-start", marginBottom: 12, flexDirection: "column", alignItems: isMe ? "flex-end" : "flex-start" } },
                  e('div', { style: { background: isMe ? `linear-gradient(135deg, ${TD}, ${TC})` : "rgba(255,255,255,0.06)", padding: "10px 12px", borderRadius: isMe ? "12px 12px 0 12px" : "12px 12px 12px 0", maxWidth: "85%" } },
                    e('div', { style: { fontSize: 14 } }, isTrans ? translatedMsgs[m.id] : m.text),
                    e('div', { style: { fontSize: 9, color: "rgba(255,255,255,0.4)", textAlign: "right", marginTop: 4 } }, m.time)
                  ),
                  !isMe && e('button', { 
                    onClick: () => handleTranslate(m.id, m.text), 
                    style: { background: "transparent", border: "none", color: TC, fontSize: 11, cursor: "pointer", marginTop: 2, padding: "2px 4px" } 
                  }, isTrans ? "↩ Оригинал" : t.translateBtn)
                );
              })
            ),
            e('div', { style: { padding: "10px", background: "#0b0816", borderTop: `1px solid ${BR}`, display: "flex", gap: 8, marginBottom: 8 } },
              e('input', { value: text, onChange: e => setText(e.target.value), placeholder: t.msgPlh, style: { flex: 1, padding: "10px 12px", background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 10, color: "#fff" } }),
              e('button', { onClick: () => { if (text.trim()) { onSend(text.trim()); setText(""); } }, style: { background: TC, border: "none", width: 40, height: 40, borderRadius: 10, color: "#fff", fontWeight: 700 } }, "➔")
            )
          );
        }

        function UserProfileView({ user, isSelf, onBack, onOpenChat, onEdit, lang }) {
          const t = TRANSLATIONS_DATA[lang];

          return e('div', { style: { display: "flex", flexDirection: "column", height: "100%" } },
            e(HeaderBar, { 
              title: user?.name || "", 
              onBack: onBack, 
              lang: lang, 
              rightElement: isSelf && e('button', { 
                onClick: onEdit, 
                style: { color: "#fff", background: "rgba(255,255,255,0.1)", border: `1px solid ${TC}`, fontSize: 11, fontWeight: 700, padding: "5px 12px", borderRadius: 8 } 
              }, "✎ Edit") 
            }),
            e('div', { style: { overflowY: "auto", flex: 1, padding: "16px", paddingBottom: 70 } },
              e('div', { style: { display: "flex", alignItems: "center", gap: 14, marginBottom: 16 } },
                e(Avatar, { user: user, size: 68 }),
                e('div', null, e('h2', { style: { margin: 0, fontSize: 18 } }, user?.name), e('div', { style: { fontSize: 12, color: TC } }, user?.location))
              ),
              !isSelf && e('button', { onClick: () => onOpenChat(user), style: { width: "100%", padding: "10px 0", background: TC, border: "none", borderRadius: 10, color: "#fff", fontWeight: 700, marginBottom: 14 } }, t.btnMsg),
              e('p', { style: { background: "rgba(255,255,255,0.02)", border: `1px solid ${BR}`, padding: 12, borderRadius: 12, fontSize: 13 } }, user?.bio),
              
              e(FieldLabel, { text: t.statusTitle, marginTop: 14 }),
              e('div', { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 } },
                STATUS_OPTIONS.map(opt => {
                  const hasOpt = user && user[opt.key];
                  const labelKey = 'label' + lang.charAt(0).toUpperCase() + lang.slice(1);
                  return e('div', { key: opt.key, style: { display: "flex", alignItems: "center", gap: 6, background: hasOpt ? "rgba(0, 191, 179, 0.08)" : "rgba(255,255,255,0.02)", padding: "8px 10px", borderRadius: 10, border: `1px solid ${hasOpt ? 'rgba(0,191,179,0.3)' : 'transparent'}`, opacity: hasOpt ? 1 : 0.3 } },
                    e('span', null, opt.icon), e('span', { style: { fontSize: 10 } }, opt[labelKey] || opt.labelEn)
                  );
                })
              )
            )
          );
        }

        function EditProfileScreen({ user, onSave, onCancel, lang }) {
          const t = TRANSLATIONS_DATA[lang];
          const [form, setForm] = useState({ ...user });
          return e('div', { style: W },
            e(HeaderBar, { title: t.editTitle, onBack: onCancel, lang: lang, rightElement: e('button', { onClick: () => onSave(form), style: { color: TC, background: "none", border: "none", fontWeight: 700 } }, t.done) }),
            e('div', { style: { overflowY: "auto", flex: 1, padding: "14px" } },
              e(FieldLabel, { text: t.nameLbl }), e('input', { value: form.name, onChange: e => setForm({ ...form, name: e.target.value }), style: IS }),
              e(FieldLabel, { text: t.aboutLbl }), e('textarea', { value: form.bio, onChange: e => setForm({ ...form, bio: e.target.value }), style: { ...IS, height: 70 } })
            )
          );
        }

        // ОБНОВЛЕННОЕ НИЖНЕЕ МЕНЮ: ПЛАШКИ ПРИПОДНЯТЫ И СДЕЛАНЫ ЯРЧЕ
        function BottomNavigationBar({ activeTab, onTabChange }) {
          const navItems = [ { id: "feed", icon: "🏠" }, { id: "map", icon: "📍" }, { id: "housing", icon: "🔑" }, { id: "messages", icon: "✉" }, { id: "profile", icon: "👤" } ];
          return e('div', { style: { position: "absolute", bottom: 10, left: 0, width: "100%", display: "flex", justifyContent: "space-around", padding: "0 10px", zIndex: 10 } },
            e('div', { style: { width: "100%", background: "rgba(10, 6, 22, 0.92)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 20, display: "flex", justifyContent: "space-around", padding: "10px 6px", boxShadow: "0 8px 24px rgba(0,0,0,0.6)", backdropFilter: "blur(15px)" } },
              navItems.map(item => {
                const isSel = activeTab === item.id;
                return e('button', { 
                  key: item.id, 
                  onClick: () => onTabChange(item.id), 
                  style: { 
                    background: isSel ? `linear-gradient(135deg, ${TD}, ${TC})` : "rgba(255,255,255,0.03)", 
                    border: `1px solid ${isSel ? TC : 'rgba(255,255,255,0.05)'}`, 
                    fontSize: 18, 
                    width: 44, height: 44, borderRadius: 14,
                    color: isSel ? "#fff" : "rgba(255,255,255,0.45)", 
                    cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                    boxShadow: isSel ? `0 0 10px ${TC}50` : "none",
                    transition: "all 0.2s ease"
                  } 
                }, item.icon);
              })
            )
          );
        }

        function App() {
          const [lang, setLang] = useState(null);
          const [me, setMe] = useState(null);
          const [users, setUsers] = useState([]);
          const [activeTab, setActiveTab] = useState("feed");
          const [currentScreen, setCurrentScreen] = useState("langSelect");
          const [selectedUser, setSelectedUser] = useState(null);
          const [favIds, setFavIds] = useState([1]);
          const [msgs, setMsgs] = useState({});

          useEffect(() => {
            if (lang) {
              setUsers(getLocalizedUsers(lang));
              setMsgs({
                1: [ { id: 101, from: "them", text: "Привет! Будешь в городе?", time: "11:00" } ],
                2: [ { id: 201, from: "them", text: "Привет! Есть свободные места в машине на пятницу.", time: "15:20" } ]
              });
              if (me) setMe(prev => ({ ...prev, location: TRANSLATIONS_DATA[lang].ukraine }));
            }
          }, [lang]);

          const handleRegister = name => {
            setMe({ id: 999, name, location: "Kyiv", occupation: "Traveler", bio: "Hello!", isHost: false, likes: 0, subscribers: 1, rating: 5.0, reviews: [], housingInfo: null });
            setCurrentScreen("mainFlow"); setActiveTab("feed");
          };

          if (currentScreen === "langSelect") return e(LangSelectScreen, { onSelect: c => { setLang(c); setCurrentScreen("auth"); } });
          if (currentScreen === "auth") return e(AuthScreen, { onDone: handleRegister, lang: lang, onBack: () => setCurrentScreen("langSelect") });

          const renderMainContent = () => {
            if (currentScreen === "viewProfile" && selectedUser) return e(UserProfileView, { user: selectedUser, isSelf: selectedUser.id === me.id, onBack: () => setCurrentScreen("mainFlow"), onOpenChat: u => { setSelectedUser(u); setCurrentScreen("chatView"); }, onEdit: () => setCurrentScreen("editProfile"), lang: lang });
            if (currentScreen === "editProfile") return e(EditProfileScreen, { user: me, onSave: f => { setMe(f); setCurrentScreen("mainFlow"); setActiveTab("profile"); }, onCancel: () => setCurrentScreen("mainFlow"), lang: lang });
            if (currentScreen === "chatView" && selectedUser) return e(SingleChatView, { user: selectedUser, messages: msgs[selectedUser.id] || [], onBack: () => setCurrentScreen("mainFlow"), onSend: t => setMsgs(p => ({ ...p, [selectedUser.id]: [...(p[selectedUser.id] || []), { id: Date.now(), from: "me", text: t, time: "12:05" }] })), lang: lang });

            switch (activeTab) {
              case "feed": return e(FeedScreen, { users: users, favIds: favIds, onToggleFav: id => setFavIds(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]), onSelectUser: u => { setSelectedUser(u); setCurrentScreen("viewProfile"); }, lang: lang, onLangToggle: () => setCurrentScreen("langSelect"), me: me, onSelectMyProfile: () => { setSelectedUser(me); setCurrentScreen("viewProfile"); } });
              case "map": return e(MapScreen, { users: users, onSelectUser: u => { setSelectedUser(u); setCurrentScreen("viewProfile"); }, lang: lang });
              case "housing": return e(HousingScreen, { users: users, onSelectUser: u => { setSelectedUser(u); setCurrentScreen("viewProfile"); }, lang: lang });
              case "messages": return e(ChatsScreen, { users: users, msgs: msgs, onOpenChat: u => { setSelectedUser(u); setCurrentScreen("chatView"); }, lang: lang });
              case "profile": return e(UserProfileView, { user: me, isSelf: true, lang: lang, onEdit: () => setCurrentScreen("editProfile"), onBack: () => { setActiveTab("feed"); } });
              default: return null;
            }
          };

          const showBottomMenu = currentScreen === "mainFlow";

          return e('div', { style: { display: "flex", justifyContent: "center", minHeight: "100vh" } },
            e('div', { style: { width: "100%", maxWidth: 430, height: "100vh", position: "relative", overflow: "hidden", display: "flex", flexDirection: "column", paddingBottom: showBottomMenu ? "75px" : "0", boxShadow: "0 0 30px rgba(0,0,0,0.5)" } },
              renderMainContent(),
              showBottomMenu ? e(BottomNavigationBar, { activeTab: activeTab, onTabChange: id => setActiveTab(id) }) : null
            )
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(e(App));
    </script>
</body>
</html>
