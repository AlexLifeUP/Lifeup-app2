          { key:"againstSmoking",     icon:"🚭", labelKey:"againstSmoking" },
          { key:"drinksAlcohol",      icon:"🍷", labelKey:"drinksAlcohol" },
          { key:"isVegetarian",       icon:"🥗", labelKey:"isVegetarian" },
          { key:"doesSport",          icon:"🏃", labelKey:"doesSport" },
          { key:"openToOffers",       icon:"💡", labelKey:"openToOffers" },
        ];

        const TC = "#00bfb3"; const PU = "#7c3aed";
        const BG = "linear-gradient(160deg,#1a0533 0%,#0d1f3c 100%)";
        const BR = "rgba(255,255,255,.09)";
        const ACOLS = ["#00897b","#7c3aed","#0e9af0","#e91e8c","#f59e0b"];
        const acol = id => ACOLS[id % ACOLS.length];
        const ini = n => n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();

        function Ava({ user, size=48 }) {
          return <div style={{ width:size,height:size,borderRadius:"50%",background:acol(user.id),display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:size*.33,color:"#fff",flexShrink:0,border:"2px solid rgba(255,255,255,.12)" }}>{ini(user.name)}</div>;
        }

        function Bar({ title, onBack, right, lang, onLangClick }) {
          return (
            <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:TC,flexShrink:0 }}>
              <div style={{ width:44 }}>
                {onBack ? <button onClick={onBack} style={{ background:"transparent",border:"none",color:"#fff",fontSize:22,cursor:"pointer" }}>←</button> : <span style={{ color:"#fff",fontSize:20 }}>☰</span>}
              </div>
              <span style={{ fontSize:17,fontWeight:700,color:"#fff" }}>{title}</span>
              <div style={{ width:55,display:"flex",justifyContent:"flex-end", gap: 8, alignItems:"center" }}>
                <span onClick={onLangClick} style={{fontSize:13, fontWeight:700, background:"rgba(0,0,0,0.2)", padding:"2px 5px", borderRadius:4, cursor:"pointer", textTransform:"uppercase"}}>{lang}</span>
                {right||<span style={{color:"#fff",fontSize:18}}>🔍</span>}
              </div>
            </div>
          );
        }

        const W = { display:"flex",flexDirection:"column",height:"100%",background:BG,color:"#fff" };
        const SC = { overflowY:"auto",flex:1 };
        const IS = { width:"100%",padding:"11px 14px",background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.12)",borderRadius:10,color:"#fff",fontSize:14,outline:"none",boxSizing:"border-box",marginBottom:6 };
        const Lbl = ({ c, mt=12 }) => <div style={{ fontSize:11,color:"rgba(255,255,255,.4)",fontWeight:600,marginBottom:5,marginTop:mt }}>{c}</div>;

        // ═══════════════════════════════════════════════════════════════
        // ЭКРАН ВЫБОРА ЯЗЫКА (НОВЫЙ)
        // ═══════════════════════════════════════════════════════════════
        function LangSelect({ onSelect }) {
          const langs = [
            {code: "ua", name: "🇺🇦 Українська"},
            {code: "ru", name: "🇷🇺 Русский"},
            {code: "en", name: "🇬🇧 English"},
            {code: "de", name: "🇩🇪 Deutsch"}
          ];
          return (
            <div style={{ minHeight:"100vh",background:"linear-gradient(135deg,#1a0533,#2d1060,#0f2a4a)",display:"flex",alignItems:"center",justifyContent:"center",padding:24 }}>
              <div style={{ width:"100%",maxWidth:340,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.12)",borderRadius:40,padding:"38px 28px 30px",backdropFilter:"blur(20px)", textAlign:"center" }}>
                <div style={{ marginBottom:26 }}>
                  <span style={{ border:"2px solid "+TC,padding:"5px 10px",fontSize:24,fontWeight:800,color:TC,borderRadius:"6px 0 0 6px" }}>LIFE</span>
                  <span style={{ background:TC,padding:"5px 10px",fontSize:24,fontWeight:800,color:"#fff",borderRadius:"0 6px 6px 0" }}>UP</span>
                </div>
                <h3 style={{color:"#fff", marginBottom:20, fontFamily:"sans-serif"}}>Select Language / Виберіть мову</h3>
                <div style={{display:"flex", flexDirection:"column", gap:12}}>
                  {langs.map(l => (
                    <button key={l.code} onClick={() => onSelect(l.code)} style={{ width:"100%",padding:"13px 0",background:"rgba(255,255,255,.08)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:12,color:"#fff",fontSize:16,fontWeight:600, cursor:"pointer" }}>
                      {l.name}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          );
        }

        function Register({ onDone, lang }) {
          const t = TRANSLATIONS[lang];
          const [mode,setMode] = useState("login");
          const [name,setName] = useState("");
          const [phone,setPhone] = useState("");
          const [pass,setPass] = useState("");
          return (
            <div style={{ minHeight:"100vh",background:"linear-gradient(135deg,#1a0533,#2d1060,#0f2a4a)",display:"flex",alignItems:"center",justifyContent:"center",padding:24 }}>
              <div style={{ width:"100%",maxWidth:340,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.12)",borderRadius:40,padding:"38px 28px 30px",backdropFilter:"blur(20px)" }}>
                <div style={{ textAlign:"center",marginBottom:26 }}>
                  <span style={{ border:"2px solid "+TC,padding:"5px 10px",fontSize:24,fontWeight:800,color:TC,borderRadius:"6px 0 0 6px" }}>LIFE</span>
                  <span style={{ background:TC,padding:"5px 10px",fontSize:24,fontWeight:800,color:"#fff",borderRadius:"0 6px 6px 0" }}>UP</span>
                </div>
                <div style={{ display:"flex",marginBottom:18,background:"rgba(255,255,255,.07)",borderRadius:10,padding:3 }}>
                  {[["login",t.login],["register",t.register]].map(([m,l])=><button key={m} onClick={()=>setMode(m)} style={{ flex:1,padding:"8px 0",borderRadius:8,border:"none",background:mode===m?TC:"transparent",color:"#fff",fontWeight:600 }}>{l}</button>)}
                </div>
                {mode==="register" && <input placeholder={t.namePlh} value={name} onChange={e=>setName(e.target.value)} style={IS} />}
                <input placeholder={t.phonePlh} value={phone} onChange={e=>setPhone(e.target.value)} style={IS} />
                <input type="password" placeholder={t.passPlh} value={pass} onChange={e=>setPass(e.target.value)} style={IS} />
                <button onClick={()=>onDone(name||"User")} style={{ width:"100%",padding:"13px 0",background:`linear-gradient(90deg,${TC},${PU})`,border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:700, cursor:"pointer" }}>
                  {mode==="login"?t.btnIn:t.btnReg}
                </button>
              </div>
            </div>
          );
        }

        function Feed({ users, me, favIds, onToggleFav, onProfile, onMyProfile, onAbout, onMsg, isFavScreen = false, lang, changeLang }) {
          const t = TRANSLATIONS[lang];
          const [q,setQ] = useState("");
          const list = users.filter(u => {
            if (isFavScreen && !favIds.includes(u.id)) return false;
            const mS = !q || u.name.toLowerCase().includes(q.toLowerCase()) || u.tags.some(t => t.toLowerCase().includes(q.toLowerCase())) || u.location.toLowerCase().includes(q.toLowerCase());
            return mS;
          });
          return (
            <div style={W}>
              <div style={{ background:TC,padding:"12px 16px 10px",flexShrink:0 }}>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:9 }}>
                  <button onClick={onAbout} style={{ background:"rgba(255,255,255,.18)",border:"none",borderRadius:8,padding:"3px 8px",color:"#fff", cursor:"pointer" }}>{t.aboutProj}</button>
                  <button onClick={onMyProfile} style={{ background:"rgba(255,255,255,.18)",border:"none",borderRadius:20,padding:"5px 10px",color:"#fff",display:"flex",alignItems:"center",gap:6, cursor:"pointer" }}>
                    <Ava user={me} size={22} /><span>{me.name}</span>
                  </button>
                </div>
                <div style={{display:"flex", gap:8, alignItems:"center"}}>
                  <input value={q} onChange={e=>setQ(e.target.value)} placeholder={t.searchPlh} style={{...IS, margin:0}} />
                  <span onClick={changeLang} style={{fontSize:12, fontWeight:700, background:"rgba(0,0,0,0.2)", padding:"6px 8px", borderRadius:8, cursor:"pointer", textTransform:"uppercase"}}>{lang}</span>
                </div>
              </div>
              <div style={SC}>
                {list.map(u=>(
                  <div key={u.id} onClick={()=>onProfile(u)} style={{ display:"flex",gap:12,padding:"13px 16px",borderBottom:"1px solid rgba(255,255,255,.06)", cursor:"pointer" }}>
                    <Ava user={u} size={54} />
                    <div style={{ flex:1 }}>
                      <div style={{ fontWeight:700 }}>{u.name}</div>
                      <div style={{ fontSize:12,color:"rgba(255,255,255,.4)" }}>{u.location}</div>
                      <div style={{ fontSize:13,color:"rgba(255,255,255,.6)" }}>{u.bio}</div>
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", gap:10, justifyContent:"center" }}>
                      <button onClick={e=>{e.stopPropagation();onMsg(u);}} style={{ background:"transparent",border:"none",fontSize:18, cursor:"pointer" }}>💬</button>
                      <button onClick={e=>{e.stopPropagation();onToggleFav(u.id);}} style={{ background:"transparent", border:"none", fontSize:20, color:favIds.includes(u.id)?"#f59e0b":"#fff", cursor:"pointer" }}>{favIds.includes(u.id)?"★":"☆"}</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function Profile({ user, isSelf, onEdit, onBack, lang, changeLang }) {
          const t = TRANSLATIONS[lang];
          return (
            <div style={W}>
              <Bar title={user.name} onBack={onBack} lang={lang} onLangClick={changeLang} right={isSelf && <button onClick={onEdit} style={{color:"#fff",background:"none",border:"none", fontSize:16, cursor:"pointer"}}>✎</button>} />
              <div style={{...SC, padding:20}}>
                <div style={{display:"flex", alignItems:"center", gap:16, marginBottom:16}}>
                   <Ava user={user} size={78} />
                   <div>
                     <h2 style={{margin:0}}>{user.name}</h2>
                     <div style={{fontSize:14, color:"rgba(255,255,255,0.4)"}}>{user.location}</div>
                   </div>
                </div>
                <p style={{background:"rgba(255,255,255,0.04)", padding:14, borderRadius:12, border:`1px solid ${BR}`}}>{user.bio}</p>
                <Lbl c={t.statusLbl} />
                <div style={{display:"flex", flexDirection:"column", gap:8, marginTop:8}}>
                  {STATUS_OPTIONS.filter(o=>user[o.key]).map(o=>(
                    <div key={o.key} style={{background:"rgba(255,255,255,0.06)", padding:"8px 12px", borderRadius:8, fontSize:14}}>
                      {t[o.labelKey]}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        }

        function EditProfile({ user, onSave, onCancel, lang }) {
          const t = TRANSLATIONS[lang];
          const [form,setForm] = useState({...user});
          return (
            <div style={W}>
              <Bar title={t.editTitle} onBack={onCancel} lang={lang} right={<button onClick={()=>onSave(form)} style={{color:"#fff",background:"none",border:"none", fontWeight:700, cursor:"pointer"}}>{t.done}</button>} />
              <div style={{...SC, padding:20}}>
                <Lbl c={t.nameLbl}/><input value={form.name} onChange={e=>setForm({...form, name:e.target.value})} style={IS} />
                <Lbl c={t.aboutLbl}/><textarea value={form.bio} onChange={e=>setForm({...form, bio:e.target.value})} style={{...IS, height:100, resize:"none"}} />
              </div>
            </div>
          );
        }

        function MsgList({ users, msgs, onBack, onChat, lang, changeLang }) {
          const t = TRANSLATIONS[lang];
          const chats = users.filter(u => msgs[u.id] && msgs[u.id].length > 0).map(u => ({ user: u, last: msgs[u.id].at(-1) }));
          return (
            <div style={W}>
              <Bar title={t.messagesTitle} onBack={onBack} lang={lang} onLangClick={changeLang} />
              <div style={SC}>
                {chats.map(({user:u,last})=>(
                  <div key={u.id} onClick={()=>onChat(u)} style={{ display:"flex",padding:16,borderBottom:`1px solid ${BR}`, cursor:"pointer", alignItems:"center" }}>
                    <Ava user={u} size={44} />
                    <div style={{marginLeft:12, flex:1}}>
                      <div style={{fontWeight:600}}>{u.name}</div>
                      <div style={{fontSize:13,color:"rgba(255,255,255,0.5)", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", maxWidth:200}}>{last.text}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function Chat({ user, messages, onBack, onSend, lang }) {
          const t = TRANSLATIONS[lang];
          const [txt,setTxt] = useState("");
          return (
            <div style={W}>
              <Bar title={user.name} onBack={onBack} lang={lang} />
              <div style={{...SC, padding:12}}>
                {messages.map(m=><div key={m.id} style={{textAlign:m.from==="me"?"right":"left", margin:"8px 0"}}><span style={{background:m.from==="me"?TC:"rgba(255,255,255,0.1)", padding:"8px 12px", borderRadius:14, display:"inline-block", maxWidth:"75%", textAlign:"left", fontSize:14}}>{m.text}</span></div>)}
              </div>
              <div style={{padding:12, display:"flex", gap:10, borderTop:`1px solid ${BR}`, background:"rgba(0,0,0,0.1)"}}>
                <input value={txt} onChange={e=>setTxt(e.target.value)} style={{...IS, margin:0}} placeholder={t.msgPlh} />
                <button onClick={()=>{if(txt.trim()){onSend(txt);setTxt("");}}} style={{background:TC, border:"none", color:"#fff", borderRadius:10, padding:"0 16px", fontWeight:700, cursor:"pointer"}}>{t.send}</button>
              </div>
            </div>
          );
        }

        function MapScr({ onBack, lang }) {
          const t = TRANSLATIONS[lang];
          return <div style={W}><Bar title={t.mapTitle} onBack={onBack} lang={lang} /><div style={{...SC, padding:40, textAlign:"center", color:"rgba(255,255,255,0.4)"}}>{t.mapDev}</div></div>;
        }

        function Subscribers({ onBack, lang }) {
          const t = TRANSLATIONS[lang];
          return <div style={W}><Bar title={t.searchTitle} onBack={onBack} lang={lang} /><div style={{...SC, padding:40, textAlign:"center", color:"rgba(255,255,255,0.4)"}}>{t.searchEmpty}</div></div>;
        }

        function About({ onClose, lang }) {
          const t = TRANSLATIONS[lang];
          return <div style={W}><Bar title={t.aboutTitle} onBack={onClose} lang={lang} /><div style={{...SC, padding:20}}><h3>LifeUp Network</h3><p style={{color:"rgba(255,255,255,0.7)"}}>{t.aboutDesc}</p></div></div>;
        }

        function Nav({ active, onChange }) {
          return (
            <div style={{ position:"fixed",bottom:0
