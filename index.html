</head>
<body>

        // Опции фильтров и тегов статуса
        const STATUS_OPTIONS = [

            btnIn: "УВІЙТИ", btnReg: "ЗАРЕЄСТРУВАТИСЯ", hostBadge: "HOST", companionBadge: "ПОПУТНИК", driverBadge: "ДРАЙВ",
            btnMsg: "Написати", btnCall: "Дзвінок", btnRent: "Забронювати", tabsFeed: "Усі", tabsFav: "Обране",

            revTitle: "Відгуки користувачів", addRev: "Залишити відгук", revPlh: "Опишіть ваш досвід спілкування або проживання...",
            priceFree: "Безкоштовно / За відгук", rating: "Рейтинг", filterAll: "Усі локації", logout: "Вийти"

            searchPlh: "🔍 Поиск людей, городов, тегов...", emptyList: "🌍 Никого не найдено",

            btnIn: "ВОЙТИ", btnReg: "ЗАРЕГИСТРИРОВАТЬСЯ", hostBadge: "HOST", companionBadge: "ПОПУТЧИК", driverBadge: "ДРАЙВ",
            btnMsg: "Написать", btnCall: "Звонок", btnRent: "Забронировать", tabsFeed: "Все", tabsFav: "Избранное",
            statsLikes: "Лайки", statsSubs: "Подписчики", statsRev: "Отзывы", statusTitle: "Особенности & Status",
            editTitle: "Редактировать профиль", done: "Сохранить", cancel: "Отмена", nameLbl: "Имя", aboutLbl: "О себе", locLbl: "Город/Локация", occLbl: "Профессия/Деятельность",
            housingTitle: "Каталог жилья (Couchsurfing)", housingDesc: "Найди бесплатное или дружественное жилье у путешественников",
            mapDesc: "Интерактивный радар путешественников вокруг тебя", mapSearch: "Искать в этом районе",
            emptyMsgs: "У вас еще нет активных диалогов. Напишите кому-нибудь!", msgPlh: "Введите сообщение...", send: "Отправить",
            revTitle: "Отзывы пользователей", addRev: "Оставить отзыв", revPlh: "Опишите ваш опыт общения или проживания...",
            priceFree: "Бесплатно / За отзыв", rating: "Рейтинг", filterAll: "Все локации", logout: "Выйти"
          },
          en: {
            appTitle: "LifeUp Network", feed: "Feed", map: "Map", housing: "Housing", messages: "Chats", profile: "Profile",
            searchPlh: "🔍 Search users, locations, tags...", emptyList: "🌍 No users found",
            aboutProj: "ℹ About project", login: "Login", register: "Register", namePlh: "Your name", phonePlh: "Phone or email", passPlh: "Password",
            btnIn: "LOG IN", btnReg: "SIGN UP", hostBadge: "HOST", companionBadge: "COMPANION", driverBadge: "DRIVER",
            btnMsg: "Message", btnCall: "Call", btnRent: "Book Stay", tabsFeed: "All", tabsFav: "Favorites",
            statsLikes: "Likes", statsSubs: "Followers", statsRev: "Reviews", statusTitle: "Features & Status",
            editTitle: "Edit Profile", done: "Save", cancel: "Cancel", nameLbl: "Name", aboutLbl: "About me", locLbl: "City/Location", occLbl: "Occupation",
            housingTitle: "Housing Directory (Couchsurfing)", housingDesc: "Find free or friendly hosting from fellow travelers",
            mapDesc: "Interactive radar of travelers near you", mapSearch: "Search this area",
            emptyMsgs: "No active dialogs yet. Drop a line to someone!", msgPlh: "Type a message...", send: "Send",
            revTitle: "User Reviews", addRev: "Leave Review", revPlh: "Describe your experience communicating or staying...",
            priceFree: "Free / For Review", rating: "Rating", filterAll: "All locations", logout: "Log Out"
          }
        };

        const getLocalizedUsers = (lang) => [
          {
            id: 1, name: "Алиса Шевченко", location: TRANSLATIONS_DATA[lang].kharkiv, occupation: TRANSLATIONS_DATA[lang].designer,
            bio: TRANSLATIONS_DATA[lang].bio1, tags: ["#tourism", "#фото", "#friends", "#road"],
            isHost: true, lookingForCompanion: true, canDrive: true, againstSmoking: true, drinksAlcohol: false, isVegetarian: true, doesSport: true, openToOffers: true, lookingForRelations: false, openToMeet: true,
            likes: 142, subscribers: 320, reviewsCount: 12, rating: 4.9, lat: 49.9935, lng: 36.2304,
            reviews: [
                { id: 1, author: "Андрей М.", text: "Отличный хост! Квартира очень чистая и уютная." },
                { id: 2, author: "Евгений С.", text: "Прекрасный человек и интересный собеседник." }
            ],
            housingInfo: { title: "Уютная комната в центре возле парка", sleepPlaces: 2, rules: "Без шумных вечеринок." }
          },
          {
            id: 2, name: "Андрей Мотьков", location: TRANSLATIONS_DATA[lang].kyiv, occupation: TRANSLATIONS_DATA[lang].designer,
            bio: TRANSLATIONS_DATA[lang].bio2, tags: ["#road", "#car", "#music"],
            isHost: false, lookingForCompanion: true, canDrive: true, againstSmoking: true, drinksAlcohol: true, isVegetarian: false, doesSport: true, openToOffers: true, lookingForRelations: false, openToMeet: true,
            likes: 98, subscribers: 154, reviewsCount: 8, rating: 4.7, lat: 50.4501, lng: 30.5234,
            reviews: [{ id: 1, author: "Лариса Н.", text: "Доехали с комфортом, Андрей отличный водитель." }],
            housingInfo: null
          },
          {
            id: 3, name: "Евгений Савченко", location: TRANSLATIONS_DATA[lang].kyiv, occupation: TRANSLATIONS_DATA[lang].designer,
            bio: TRANSLATIONS_DATA[lang].bio3, tags: ["#architecture", "#tourism"],
            isHost: true, lookingForCompanion: false, canDrive: false, againstSmoking: false, drinksAlcohol: true, isVegetarian: false, doesSport: true, openToOffers: true, lookingForRelations: true, openToMeet: true,
            likes: 210, subscribers: 489, reviewsCount: 24, rating: 5.0, lat: 49.8397, lng: 24.0297,
            reviews: [{ id: 1, author: "Алиса Ш.", text: "Лучший гид по городу! Атмосфера дома невероятная." }],
            housingInfo: { title: "Аутентичный диван в старинном доме", sleepPlaces: 1, rules: "Любить кофе и тишину." }
          }
        ];

        const ACOLS = ["#00897b", "#7c3aed", "#0e9af0", "#e91e8c", "#f59e0b", "#059669"];
        const getAvatarColor = id => ACOLS[id % ACOLS.length];
        const getInitials = name => name ? name.split(" ").map(x => x[0]).join("").slice(0, 2).toUpperCase() : "U";

        function Avatar({ user, size = 48 }) {
          return e('div', {
            style: {
              width: size, height: size, borderRadius: "50%", background: getAvatarColor(user?.id || 0),
              display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: size * 0.36, color: "#fff",
              flexShrink: 0, border: "2px solid rgba(255,255,255,.15)", boxShadow: "0 2px 6px rgba(0,0,0,0.2)"
            }
          }, getInitials(user?.name));
        }

        function HeaderBar({ title, onBack, rightElement, lang, onLangToggle }) {
          return e('div', {
            style: {
              display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", background: `linear-gradient(90deg, ${TD}, ${TC})`,
              flexShrink: 0, boxShadow: "0 2px 10px rgba(0,0,0,0.3)", zIndex: 5
            }
          },
            e('div', { style: { width: 44, display: "flex", alignItems: "center" } },
              onBack ? e('button', { onClick: onBack, style: { background: "transparent", border: "none", color: "#fff", fontSize: 22, cursor: "pointer", padding: 0 } }, "←") : e('span', { style: { fontSize: 20, opacity: 0.8 } }, "⚡")
            ),
            e('span', { style: { fontSize: 18, fontWeight: 700, color: "#fff", letterSpacing: "0.5px" } }, title),
            e('div', { style: { display: "flex", alignItems: "center", gap: 10 } },
              onLangToggle && e('button', { onClick: onLangToggle, style: { background: "rgba(0,0,0,0.2)", border: "none", color: "#fff", padding: "4px 8px", borderRadius: 6, fontSize: 12, fontWeight: 700, cursor: "pointer", textTransform: "uppercase" } }, lang),
              rightElement || e('div', { style: { width: 30 } })
            )
          );
        }

        function FieldLabel({ text, marginTop = 0 }) {
          return e('label', { style: { display: "block", fontSize: 12, fontWeight: 600, color: TC, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6, marginTop: marginTop } }, text);
        }

        function LangSelectScreen({ onSelect }) {
          return e('div', { style: { minHeight: "100vh", background: "linear-gradient(135deg, #120326, #091326)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 } },
            e('div', { style: { width: "100%", maxWidth: 340, background: "rgba(255,255,255,.04)", border: "1px solid rgba(255,255,255,.12)", borderRadius: 32, padding: "40px 24px", backdropFilter: "blur(20px)", textAlign: "center", boxShadow: "0 15px 35px rgba(0,0,0,0.5)" } },
              e('div', { style: { marginBottom: 30 } },
                e('span', { style: { border: `2px solid ${TC}`, padding: "6px 12px", fontSize: 26, fontWeight: 800, color: TC, borderRadius: "8px 0 0 8px" } }, "LIFE"),
                e('span', { style: { background: TC, padding: "6px 12px", fontSize: 26, fontWeight: 800, color: "#fff", borderRadius: "0 8px 8px 0" } }, "UP")
              ),
              e('h3', { style: { color: "#fff", marginBottom: 24, fontSize: 16, fontWeight: 500, opacity: 0.9 } }, "Select Language / Выберите язык"),
              e('div', { style: { display: "flex", flexDirection: "column", gap: 12 } },
                [ { code: "ua", name: "🇺🇦 Українська" }, { code: "ru", name: "🇷🇺 Русский" }, { code: "en", name: "🇬🇧 English" } ].map(l => e('button', { key: l.code, onClick: () => onSelect(l.code), style: { width: "100%", padding: "14px 0", background: "rgba(255,255,255,.06)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 14, color: "#fff", fontSize: 16, fontWeight: 600, cursor: "pointer" } }, l.name))
              )
            )
          );
        }

        function AuthScreen({ onDone, lang }) {
          const t = TRANSLATIONS_DATA[lang];
          const [mode, setMode] = useState("login");
          const [name, setName] = useState("");
          const [phone, setPhone] = useState("");
          const [pass, setPass] = useState("");

          return e('div', { style: { minHeight: "100vh", background: "linear-gradient(135deg, #120326, #091326)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 } },
            e('div', { style: { width: "100%", maxWidth: 350, background: "rgba(255,255,255,.03)", border: "1px solid rgba(255,255,255,.1)", borderRadius: 32, padding: "35px 24px", backdropFilter: "blur(20px)", boxShadow: "0 15px 35px rgba(0,0,0,0.5)" } },
              e('div', { style: { textAlign: "center", marginBottom: 24 } },
                e('span', { style: { border: `2px solid ${TC}`, padding: "5px 10px", fontSize: 24, fontWeight: 800, color: TC, borderRadius: "6px 0 0 6px" } }, "LIFE"),
                e('span', { style: { background: TC, padding: "5px 10px", fontSize: 24, fontWeight: 800, color: "#fff", borderRadius: "0 6px 6px 0" } }, "UP")
              ),
              e('div', { style: { display: "flex", marginBottom: 20, background: "rgba(255,255,255,.06)", borderRadius: 12, padding: 3 } },
                e('button', { onClick: () => setMode("login"), style: { flex: 1, padding: "10px 0", borderRadius: 10, border: "none", background: mode === "login" ? TC : "transparent", color: "#fff", fontWeight: 600, cursor: "pointer" } }, t.login),
                e('button', { onClick: () => setMode("register"), style: { flex: 1, padding: "10px 0", borderRadius: 10, border: "none", background: mode === "register" ? TC : "transparent", color: "#fff", fontWeight: 600, cursor: "pointer" } }, t.register)
              ),
              mode === "register" ? e('input', { placeholder: t.namePlh, value: name, onChange: e => setName(e.target.value), style: IS }) : null,
              e('input', { placeholder: t.phonePlh, value: phone, onChange: e => setPhone(e.target.value), style: IS }),
              e('input', { type: "password", placeholder: t.passPlh, value: pass, onChange: e => setPass(e.target.value), style: IS }),
              e('button', { onClick: () => onDone(name || "Traveler"), style: { width: "100%", padding: "14px 0", background: `linear-gradient(90deg, ${TC}, ${PU})`, border: "none", borderRadius: 12, color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer", marginTop: 8 } }, mode === "login" ? t.btnIn : t.btnReg)
            )
          );
        }

        function FeedScreen({ users, favIds, onToggleFav, onSelectUser, lang, onLangToggle, me, onSelectMyProfile }) {
          const t = TRANSLATIONS_DATA[lang];
          const [search, setSearch] = useState("");
          const [activeSubTab, setActiveSubTab] = useState("all");

          const filteredUsers = users.filter(u => {
            if (activeSubTab === "fav" && !favIds.includes(u.id)) return false;
            if (!search.trim()) return true;
            const q = search.toLowerCase();
            return u.name.toLowerCase().includes(q) || u.location.toLowerCase().includes(q) || u.tags.some(tag => tag.toLowerCase().includes(q));
          });

          return e('div', { style: { display: "flex", flexDirection: "column", height: "100%" } },
            e('div', { style: { background: `linear-gradient(135deg, ${TD}, #0d1f3c)`, padding: "14px 16px 12px", flexShrink: 0 } },
              e('div', { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 } },
                e('div', { style: { display: "flex", alignItems: "center", gap: 6 } }, e('span', { style: { fontSize: 20, fontWeight: 800, color: TC } }, "LIFEUP")),
                e('div', { style: { display: "flex", alignItems: "center", gap: 10 } },
                  e('button', { onClick: onLangToggle, style: { background: "rgba(255,255,255,0.12)", border: "none", color: "#fff", padding: "4px 8px", borderRadius: 6, fontSize: 12, fontWeight: 700, cursor: "pointer" } }, lang),
                  e('div', { onClick: onSelectMyProfile, style: { display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: "rgba(0,0,0,0.2)", padding: "4px 10px", borderRadius: 20 } }, e(Avatar, { user: me, size: 24 }), e('span', { style: { fontSize: 12, fontWeight: 600 } }, me?.name?.split(" ")[0]))
                )
              ),
              e('input', { value: search, onChange: e => setSearch(e.target.value), placeholder: t.searchPlh, style: IS }),
              e('div', { style: { display: "flex", gap: 10, marginTop: 12 } },
                e('button', { onClick: () => setActiveSubTab("all"), style: { flex: 1, padding: "6px 0", background: activeSubTab === "all" ? TC : "rgba(255,255,255,0.06)", border: "none", borderRadius: 8, color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" } }, t.tabsFeed),
                e('button', { onClick: () => setActiveSubTab("fav"), style: { flex: 1, padding: "6px 0", background: activeSubTab === "fav" ? PU : "rgba(255,255,255,0.06)", border: "none", borderRadius: 8, color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" } }, `${t.tabsFav} (${favIds.length})`)
              )
            ),
            e('div', { style: { overflowY: "auto", flex: 1, paddingBottom
