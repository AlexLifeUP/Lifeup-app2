<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeUp Network - MVP Final</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;900&display=swap');
        body { margin: 0; background: #060411; color: #fff; font-family: 'DM Sans', sans-serif; overflow: hidden; }
        .app-container { width: 100%; max-width: 430px; height: 100vh; margin: 0 auto; position: relative; background: #0b0816; display: flex; flex-direction: column; }
        button { cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2Nik3YtyAgYcsww6qxKFHtNDzSESj5CA",
            authDomain: "lifeup-app-30174.firebaseapp.com",
            projectId: "lifeup-app-30174",
            storageBucket: "lifeup-app-30174.firebasestorage.app",
            messagingSenderId: "190784130204",
            appId: "1:190784130204:web:9d524aab073673146cb159"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const { useState, useEffect } = React;
        const e = React.createElement;
        const TC = "#00bfb3";
        const Logo = () => e('div', {style:{display:'flex', alignItems:'center', gap:8, padding:20}},
            e('span', {style:{background:`linear-gradient(90deg, #007a75, ${TC})`, padding:'5px 12px', borderRadius:8, fontWeight:900}}, "LIFEUP"),
            e('div', {style:{width:6, height:6, borderRadius:'50%', background:'#10b981', boxShadow:'0 0 8px #10b981'}})
        );

        const BottomNav = ({active, setActive}) => e('div', {style:{position:'absolute', bottom:20, width:'100%', padding:'0 20px', display:'flex', justifyContent:'space-between'}},
            [{id:'map', i:'📍'}, {id:'housing', i:'🔑'}, {id:'feed', i:'🏠'}, {id:'msg', i:'✉'}, {id:'prof', i:'👤'}].map(nav => 
                e('button', {key:nav.id, onClick:()=>setActive(nav.id), style:{background: active===nav.id ? TC : '#1a0533', border:'none', padding:15, borderRadius:15, color:'#fff'}}, nav.i)
            )
        );
        function App() {
            const [users, setUsers] = useState([]);
            const [view, setView] = useState("feed");
            const [selected, setSelected] = useState(null);

            useEffect(() => {
                db.collection("users").onSnapshot(snap => {
                    const l = []; snap.forEach(d => l.push(d.data()));
                    // Если пусто - грузим "боевые" демо-данные, чтобы приложение не было пустым
                    setUsers(l.length > 0 ? l : Array.from({length:20}, (_,i)=>({
                        id: String(i), name: ["Алиса", "Андрей", "Евгений"][i%3] + " " + i,
                        location: "Киев, Печерск", isHost: i%2===0, bio: "Ищу попутчиков!"
                    })));
                });
            }, []);

            if (view === "feed") return e('div', {className:'app-container'}, 
                e(Logo),
                users.map(u => e('div', {key:u.id, style:{margin:10, padding:15, background:'#1a0533', borderRadius:10}, onClick:()=>setView("prof")}, 
                    e('h3', null, u.name), e('p', null, u.location)
                )),
                e(BottomNav, {active:'feed', setActive:setView})
            );
            if (view === "map") return e('div', {className:'app-container', style:{background:'#050714'}},
                e('div', {style:{padding:20, color:TC, fontWeight:900}}, "КАРТА КИЕВА"),
                e('div', {style:{flex:1, position:'relative'}},
                    users.map((u, i) => e('div', {key:i, style:{position:'absolute', top:i*30+'px', left:i*20+'px', background:'#00bfb3', padding:5, borderRadius:5}}, u.name.split(" ")[0])),
                    e('div', {style:{position:'absolute', bottom:100, right:20, display:'flex', flexDirection:'column', gap:10}},
                        e('button', {onClick:()=>alert("Zoom In"), style:{padding:15}}, "+"),
                        e('button', {onClick:()=>alert("Zoom Out"), style:{padding:15}}, "-")
                    )
                ),
                e(BottomNav, {active:'map', setActive:setView})
            );
            if (view === "prof") return e('div', {className:'app-container', style:{padding:20}},
                e('h1', null, "Профиль"),
                e('div', {style:{display:'flex', gap:10}}, 
                    e('button', {className:'btn'}, "📸 Insta"),
                    e('button', {className:'btn'}, "🟢 WA"),
                    e('button', {className:'btn'}, "✈️ TG")
                ),
                e('button', {style:{marginTop:20}, onClick:()=>setView("feed")}, "Назад")
            );

            return e('div', null, "Загрузка...");
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
